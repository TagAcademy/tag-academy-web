   1/20th (0.05) for a clean number. The small field beside it shows the
   exact value and stays directly editable for odd partial-credit numbers. ---------- */
function scorePillHtml(slot, value, label, disabled, extraAttrs, step, max) {
  const m = Number(max) || 1;
  const v = (value === null || value === undefined) ? "" : value;
  const pct = v === "" ? 0 : Math.max(0, Math.min(1, Number(v) / m)) * 100;
  const tone = v === "" ? "" : scoreTone(v, m);
  const core = '<div class="score-pill-wrap" data-max="' + m + '">' +
    '<div class="score-pill-track' + (disabled ? " score-pill-disabled" : "") + '" data-slot="' + slot + '"' + (tone ? ' data-tone="' + tone + '"' : "") + '>' +
    '<div class="score-pill-fill" style="width:' + pct + '%"' + (tone ? ' data-tone="' + tone + '"' : "") + "></div>" +
    "</div>" +
    '<input class="score-input" type="number" min="0" max="' + m + '" step="' + (step || "0.05") + '" data-slot="' + slot + '" value="' + v + '" ' + (extraAttrs || "") + (disabled ? " disabled" : "") + ">" +
    "</div>";
  // label === null skips the label/row wrapper entirely -- used by the Compact view, where
  // every student is one line and there's no room for "ATTENDANCE" / "PARTICIPATION" headers.
  if (label === null) return core;
  return '<div class="score-pill-row"><div class="score-pill-label">' + escapeHtml(label) + "</div>" + core + "</div>";
}
function refreshPillForInput(input) {
  if (!input) return;
  // .score-pill-wrap (not .score-pill-row): the row wrapper only exists when scorePillHtml
  // was called with a real label. Anchoring on the wrap instead means this also works for
  // label:null pills (Compact view's tap-to-reveal slider), which have no row wrapper. data-max
  // (set by scorePillHtml above) is how this recovers the class's max after the fact, since all
  // it has here is the bare input value.
  const wrap = input.closest(".score-pill-wrap");
  const track = wrap ? wrap.querySelector(".score-pill-track") : null;
  const fill = wrap ? wrap.querySelector(".score-pill-fill") : null;
  if (!fill) return;
  const m = Number(wrap && wrap.dataset.max) || 1;
  const v = input.value === "" ? 0 : Math.max(0, Math.min(m, Number(input.value) || 0));
  fill.style.width = (m > 0 ? (v / m) * 100 : 0) + "%";
  const tone = input.value === "" ? "" : scoreTone(input.value, m);
  if (tone) { fill.setAttribute("data-tone", tone); if (track) track.setAttribute("data-tone", tone); }
  else { fill.removeAttribute("data-tone"); if (track) track.removeAttribute("data-tone"); }
}
/* ---------- Compact view's small tap-to-edit dials (not the full-width draggable bar from
   Cards) -- a dial is barely wider than a letter, which is what keeps every row to one line.
   Tapping one reveals its own slider inline (see .src-slot/.src-slider-pop in the CSS), so
   the real draggable input lives right there instead of off-screen. The ring's own color now
   reflects the score it holds (0=red, at this class's max=green, in between=yellow -- see
   scoreTone), same as the Cards-view bars; a blank dial falls back to its plain default color
   (brand for Attendance, gold for Participation) since --fill is 0% either way and there's
   nothing to tint. ---------- */
function compactSlotHtml(slot, value, disabled, extraAttrs, max) {
  const m = Number(max) || 1;
  const v = (value === null || value === undefined) ? "" : value;
  const pct = v === "" ? 0 : circleFillPct(v, m);
  const label = slot === "att" ? "A" : "P";
  const tone = v === "" ? "" : scoreTone(v, m);
  const toneVar = tone ? ("--circle-color:var(--" + tone + ");") : "";
  return '<span class="src-slot" data-slot-wrap="' + slot + '">' +
    '<button type="button" class="src-circle src-circle-' + slot + (disabled ? " src-circle-disabled" : "") + '" data-slot-toggle="' + slot + '" style="--fill:' + pct + '%;' + toneVar + '"' + (disabled ? " disabled" : "") + '>' +
    '<span class="src-circle-ring"></span><span class="src-circle-label">' + label + "</span></button>" +
    '<span class="src-slider-pop">' + scorePillHtml(slot, value, null, disabled, extraAttrs, "0.1", m) + "</span>" +
    "</span>";
}
/* Present/Absent/Excused state of a pair, purely for lighting up the right quick-mark button
   -- a blank/unmarked student has none of the three lit, which is what makes "never marked"
   look different from "deliberately marked absent (0)" at a glance, without changing the
   dials themselves (computeStats already excludes true blanks from both the numerator and
   denominator; see its own comment). Anything that doesn't cleanly match one of the three
   (typically partial credit set via a dial's slider) lights up nothing -- the dials' own fill
   is where that value shows. max defaults to 1 -- "present" means "at this class's max", not
   literally 1, for a lower-weight class. */
function compactTriState(pair, max) {
  const m = Number(max) || 1;
  const att = pair[0], part = pair[1];
  if (pair[4]) return "excused";
  if (att === null || att === undefined) return "blank";
  if (Number(att) >= m - 1e-9 && (part === null || part === undefined || Number(part) >= m - 1e-9)) return "present";
  if (Number(att) === 0 && (part === null || part === undefined || Number(part) === 0)) return "absent";
  return "partial";
}
function pillValueFromEvent(evt, trackEl, max) {
  const m = Number(max) || 1;
  const rect = trackEl.getBoundingClientRect();
  const p = (evt.touches && evt.touches[0]) || (evt.changedTouches && evt.changedTouches[0]) || evt;
  let frac = rect.width > 0 ? (p.clientX - rect.left) / rect.width : 0;
  frac = Math.max(0, Math.min(1, frac));
  return Math.round(frac * 20) / 20 * m;
}
// Set while any Cards-view bar is actively being dragged, and checked by isViewBusy() -- the
// drag targets the track div, not the underlying (often invisible) input, so
// document.activeElement alone wouldn't notice a drag in progress, and a live update arriving
// mid-drag would otherwise yank the DOM out from under the pointer capture.
let pointerDragActive = false;
function wirePillTracks(root, onRelease) {
  root.querySelectorAll(".score-pill-track").forEach((track) => {
    if (track.classList.contains("score-pill-disabled")) return;
    const slot = track.getAttribute("data-slot");
    const wrap = track.closest(".score-pill-wrap");
    const input = wrap ? wrap.querySelector('.score-input[data-slot="' + slot + '"]') : null;
    if (!input) return;
    const trackMax = Number(wrap && wrap.dataset.max) || 1;
    let dragging = false;
    const apply = (evt) => {
      if (input.disabled) return;
      input.value = pillValueFromEvent(evt, track, trackMax);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    };
    track.addEventListener("pointerdown", (evt) => {
      if (input.disabled) return;
      dragging = true;
      pointerDragActive = true;
      try { track.setPointerCapture(evt.pointerId); } catch (e) {}
      apply(evt);
    });
    track.addEventListener("pointermove", (evt) => { if (dragging) apply(evt); });
    const stop = () => {
      const wasDragging = dragging;
      dragging = false;
      pointerDragActive = false;
      if (wasDragging && onRelease) onRelease(input);
      flushDeferredRefresh();
    };
    track.addEventListener("pointerup", stop);
    track.addEventListener("pointercancel", stop);
  });
}

/* ---------- per-student note as a small popover instead of an always-open
   field, so the card stays uncluttered. ---------- */
function notePopoverHtml(value, disabled) {
  const hasNote = !!(value && value.trim());
  return '<div class="note-pop-wrap">' +
    '<button type="button" class="note-toggle-btn" data-note-toggle aria-label="Note" title="Note">' + icon("note") +
    '<span class="note-dot"' + (hasNote ? "" : " hidden") + "></span></button>" +
    '<div class="note-popover" hidden>' +
    '<input class="note-input" type="text" data-slot="note" placeholder="Note — e.g. left early" value="' + escapeHtml(value || "") + '" ' + (disabled ? "disabled" : "") + ">" +
    (disabled ? "" : '<button type="button" class="btn btn-ghost btn-sm note-popover-close">Done</button>') +
    "</div></div>";
}
function wireNotePopovers(root) {
  root.querySelectorAll(".note-pop-wrap").forEach((wrap) => {
    const toggleBtn = wrap.querySelector(".note-toggle-btn");
    const popover = wrap.querySelector(".note-popover");
    const input = wrap.querySelector(".note-input");
    const dot = wrap.querySelector(".note-dot");
    const closeBtn = wrap.querySelector(".note-popover-close");
    if (!toggleBtn || !popover) return;
    toggleBtn.addEventListener("click", (evt) => {
      evt.stopPropagation();
      const willOpen = popover.hidden;
      root.querySelectorAll(".note-popover").forEach((p) => { if (p !== popover) p.hidden = true; });
      popover.hidden = !willOpen;
      if (willOpen && input) input.focus();
    });
    if (closeBtn) closeBtn.addEventListener("click", (evt) => { evt.stopPropagation(); popover.hidden = true; });
    popover.addEventListener("click", (evt) => evt.stopPropagation());
    if (input && dot) input.addEventListener("input", () => { dot.hidden = !input.value.trim(); });
  });
}
// Registered once (not per-render) so open popovers close on an outside click
// without piling up duplicate document-level listeners across re-renders.
document.addEventListener("click", (evt) => {
  document.querySelectorAll(".note-popover:not([hidden])").forEach((p) => {
    const wrap = p.closest(".note-pop-wrap");
    if (wrap && !wrap.contains(evt.target)) p.hidden = true;
  });
});
// Same pattern for Compact view's tap-to-edit dials -- an open slider closes on any click
// outside it, so at most one is open at a time and it never lingers after a tap elsewhere.
document.addEventListener("click", (evt) => {
  document.querySelectorAll(".src-slot.is-open").forEach((wrap) => {
    if (!wrap.contains(evt.target)) wrap.classList.remove("is-open");
  });
  flushDeferredRefresh();
});
// The Hebrew date picker (Today page) is the one popover that isn't just a CSS class toggle --
// showHebrewCal controls whether renderToday even puts the popover's HTML on the page at all,
// so closing it here means flipping that flag and re-rendering, the same as the "Cancel"-style
// paths (picking a day, changing the Gregorian date) already do. Without this, the Hebrew
// calendar was the only one of the three popovers on this page that stayed open until you
// picked a date or explicitly closed it, instead of dismissing like a normal dropdown.
// Deliberately uses composedPath() instead of `.hcal-field`.contains(evt.target): several
// buttons inside the popover (prev/next month) call renderAll() themselves while leaving it
// open, which replaces the popover's DOM mid-bubble -- by the time this listener runs,
// evt.target would be a node render already tore out, and .contains() on a detached node
// always reads as "outside," slamming the popover shut right after a month-navigation click.
// composedPath() is captured at dispatch time, before any handler had a chance to re-render,
// so it still reflects what was actually clicked regardless of what happened afterward.
document.addEventListener("click", (evt) => {
  if (!showHebrewCal) return;
  const path = typeof evt.composedPath === "function" ? evt.composedPath() : [];
  const insideField = path.some((el) => el.classList && el.classList.contains("hcal-field"));
  if (!insideField) { showHebrewCal = false; renderAll(); }
});

/* ---------- refresh-vs-interrupt: with autosave and live updates, a re-render can now be
   triggered by someone ELSE's save (or by this device's own autosave finishing for a
   different student) at any moment -- including while this person has a note popover or a
   Compact dial slider open, or is mid-drag on a Cards-view bar. renderAll() rebuilds the
   page's HTML from scratch, so doing that right then would slam an open popover/slider shut
   or yank focus out of a field. isViewBusy() below is the check: if anything on today's grid
   looks mid-interaction, a refresh is deferred (state itself still updates immediately, so
   nothing is lost) and flushed the moment that interaction ends (an outside click closing a
   popover/slider, above, or losing focus, below). ---------- */
let deferredRefreshPending = false;
function isViewBusy() {
  if (pointerDragActive) return true;
  if (document.querySelector(".note-popover:not([hidden])")) return true;
  if (document.querySelector(".src-slot.is-open")) return true;
  const root = document.getElementById("view-root");
  const ae = document.activeElement;
  if (root && ae && root !== ae && root.contains(ae) && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return true;
  return false;
}
function refreshViewOrDefer() {
  if (isViewBusy()) { deferredRefreshPending = true; return; }
  deferredRefreshPending = false;
  renderAll();
}
function flushDeferredRefresh() {
  if (deferredRefreshPending && !isViewBusy()) { deferredRefreshPending = false; renderAll(); }
}
// Losing focus on a text field is the other moment an interaction can end (tabbing/clicking
// away without necessarily triggering the click-outside handlers above) -- 'focusout' bubbles,
// unlike 'blur', so one listener on the document catches every field. The tiny delay lets the
// next element finish becoming document.activeElement first (e.g. clicking straight from one
// input into another), so isViewBusy() checks the settled state, not a momentary gap between
// the two.
document.addEventListener("focusout", () => { setTimeout(flushDeferredRefresh, 0); });
function fullName(person) { return escapeHtml(person.last) + ", " + escapeHtml(person.first); }
function studentLink(student) {
  // data-last/data-first carry the raw (HTML-escaped-for-attribute) name parts so
  // wireCompactStudentNames can rebuild "Last, First" or fall back to "Last, F." without
  // re-rendering -- see that function for why.
  return '<button type="button" class="student-link" data-student-link="' + student.id + '" data-last="' + escapeHtml(student.last) + '" data-first="' + escapeHtml(student.first) + '">' + fullName(student) + "</button>";
}
function slugUsername(first, last) {
  return (String(first).trim().toLowerCase().replace(/[^a-z0-9]/g, "") + "." + String(last).trim().toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 1)) || "user";
}
function uniqueUsername(base, takenSet) {
  let candidate = base, i = 1;
  while (takenSet.has(candidate)) { candidate = base + i; i++; }
  return candidate;
}
function randomPassword() {
  return String(Math.floor(1000 + Math.random() * 9000));
}
/* Passwords in the Admin > Staff/Students tables default to masked (dots) rather than plain
   text, since those tables are often up on a shared screen or projector -- revealedPasswords

   like "staff:<id>" or "student:<id>" so staff and student rows can't collide. */
let revealedPasswords = new Set();
/* A live, typed password input (login/signup) can't use passwordCellHtml's re-render-to-toggle
   approach -- re-rendering the page on every click would blow away whatever's mid-typed. This
   flips the input's own type between password/text in place instead, no render involved. */
function passwordFieldHtml(id, opts) {
  opts = opts || {};
  return '<div class="pwfield-wrap">' +
    '<input type="password" id="' + escapeHtml(id) + '"' +
    (opts.placeholder ? ' placeholder="' + escapeHtml(opts.placeholder) + '"' : "") +
    (opts.autocomplete ? ' autocomplete="' + escapeHtml(opts.autocomplete) + '"' : "") + ">" +
    '<button type="button" class="pwfield-toggle" data-pwfield-toggle="' + escapeHtml(id) + '">Show</button>' +
    "</div>";
}
function wirePasswordToggles(root) {
  root.querySelectorAll("[data-pwfield-toggle]").forEach((btn) => btn.addEventListener("click", () => {
    const input = document.getElementById(btn.getAttribute("data-pwfield-toggle"));
    if (!input) return;

    input.type = showing ? "password" : "text";
    btn.textContent = showing ? "Show" : "Hide";
  }));
}
function passwordCellHtml(password, revealKey) {
  const pw = password || "";
  const shown = revealedPasswords.has(revealKey);
  const display = shown ? (pw || "—") : "•".repeat(Math.max(4, Math.min(10, pw.length || 6)));
  return '<span class="pw-cell">' +
    '<span class="pw-value">' + escapeHtml(display) + "</span>" +
    (pw ? '<button type="button" class="pw-toggle" data-pw-toggle="' + escapeHtml(revealKey) + '">' + (shown ? "Hide" : "Show") + "</button>" : "") +
    "</span>";
}
/* One name per line — "Last, First" (comma) or "First Last" (no comma, last
   word taken as the surname). Returns {first, last} or null if unparseable. */
function parseNamePair(line) {
  const trimmed = line.trim();
  if (!trimmed) return null;
  if (trimmed.includes(",")) {
    const idx = trimmed.indexOf(",");
    const last = trimmed.slice(0, idx).trim();
    const first = trimmed.slice(idx + 1).trim();
    return (last && first) ? { first, last } : null;
  }
  const parts = trimmed.split(/\s+/);
  if (parts.length < 2) return null;
  return { first: parts.slice(0, -1).join(" "), last: parts[parts.length - 1] };
}
/* One name per line, optionally ", role" (defaults to teacher; anything
   starting with "admin" becomes admin). Returns {name, role} or null. */
function parseStaffLine(line) {
  const trimmed = line.trim();
  if (!trimmed) return null;
  if (trimmed.includes(",")) {
    const idx = trimmed.indexOf(",");
    const name = trimmed.slice(0, idx).trim();
    const roleRaw = trimmed.slice(idx + 1).trim().toLowerCase();
    if (!name) return null;
    return { name, role: roleRaw.indexOf("admin") === 0 ? "admin" : "teacher" };
  }
  return { name: trimmed, role: "teacher" };
}
function credentialsList(rows) {
  return rows.map((r) => (r.last ? r.first + " " + r.last : r.name) + " — username: " + r.username + ", password: " + r.password).join("\n");
}

/* ---------- Firebase (Firestore) ---------- */
/* Signing in as APP_SERVICE_EMAIL is invisible to the user — it's not a login
   screen, just how the page proves to Firestore's security rules that it's
   allowed to read/write at all. The app's own username/password login (below,
   under AUTH) is the real sign-in a person sees and uses; it's unrelated to this. */
const firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
const firebaseAuth = firebase.auth();
const db = firebase.firestore();
const STATE_DOC = db.collection("app").doc("state");

let state = null; // set once loadState() resolves

async function loadState() {
  await firebaseAuth.signInWithEmailAndPassword(APP_SERVICE_EMAIL, APP_SERVICE_PASSWORD);
  const snap = await STATE_DOC.get();
  if (snap.exists) {
    state = snap.data();
  } else {
    // First run for this Firebase project — create the starting document.
    state = seedState();
    await STATE_DOC.set(state);
  }
}

/* ---------- derived helpers ---------- */
function activeRoster() {

/* ---------- age groups (Leaderboard) ---------- */
/* Only a year of birth is collected (not a full birthdate), so age is approximate — good
   enough for grouping into bands, not for anything that needs to be exact to the day. Bands
   are a fixed 2-year width, even-anchored (8–9, 10–11, ...) and computed on the fly from
   whatever birth years are actually in the roster, so there's nothing to configure up front;
   a school can always widen AGE_BAND_WIDTH later if 2-year bands feel too fine. */

function periodsForDate(dateStr) {

  // One-off classes added just for this date (see extraPeriodsFor / renderToday's "add a class
  // just for today") count as scheduled for this date only — this is the single place stats,
  // exports, and the Today grid all agree on which classes ran on a given day.
  const extra = extraPeriodsFor(dateStr).filter((p) => !scheduled.includes(p));

}
function extraPeriodsFor(dateStr) {

}

function isBonusPeriod(dateStr, period) {

/* opts: { from, to } — inclusive ISO date bounds, either omittable; { period } — restrict to one

   categoryFor) instead of a single named period. period and category are mutually exclusive;

function computeStats(studentId, opts) {

  const scoped = !!(onlyPeriod || onlyCategory);
  let attPts = 0, attPoss = 0, partPts = 0, partPoss = 0, attCount = 0, partCount = 0;
  for (const rec of state.attendance) {
    if (rec.studentId !== studentId) continue;
    if (from && rec.date < from) continue;
    if (to && rec.date > to) continue;
    const scheduledToday = periodsForDate(rec.date);
    let periods;
    if (onlyPeriod) periods = scheduledToday.includes(onlyPeriod) ? [onlyPeriod] : [];
    else if (onlyCategory) periods = scheduledToday.filter((p) => categoryFor(p) === onlyCategory);
    else periods = scheduledToday;
    for (const p of periods) {
      const pair = rec.scores && rec.scores[p];
      if (!pair) continue;
      const [a, pt] = pair;
      const bonus = isBonusPeriod(rec.date, p);
      // A class's own max (see periodMaxFor, set in Admin > Schedule -- most classes are a
      // normal full-weight 1) is what a fully-marked score there is possible-out-of: a lower
      // max simply contributes less to the denominator (and, since the mark itself is stored
      // already scaled to that max, less to the numerator too), so a short/supplementary class
      // counts for proportionally less of the blended average instead of weighing the same as
      // every other class.
      const maxVal = periodMaxFor(p);
      // Percentages count only what was actually marked — a blank attendance or participation
      // score is left out of both the numerator and the denominator, rather than counting
      // against the student as a 0. A bonus class (admin-toggled per date+period) goes one
      // step further: whatever was marked still adds to the numerator as usual, but never
      // adds to the denominator — so a great score there raises the average, while a poor one
      // (or no mark at all) leaves it exactly where it was instead of dragging it down.
      // Math.min(..., maxVal): a mark is always saved within its class's max at the time (see
      // clampScore), but if an admin lowers a class's max after scores already exist under the
      // old (higher) one, this keeps an old over-the-new-max mark from pushing a percentage
      // past 100% -- it's simply worth this class's current max instead.

    }

  const pointsPerCoin = state.settings.pointsPerCoin || 10;
  const coinsEarned = Math.floor((attPts + partPts) / pointsPerCoin);
  let ledgerNet = 0;
  if (!scoped) {
    for (const tx of state.ledger) {
      if (tx.studentId !== studentId) continue;
      if (from && tx.date < from) continue;
      if (to && tx.date > to) continue;
      const sign = (tx.type === "Spent/Redeemed" || tx.type === "Transfer Out") ? -1 : 1;
      ledgerNet += sign * Number(tx.amount || 0);

  }

    attPts, attPoss, attPct: attPoss ? attPts / attPoss : null,
    partPts, partPoss, partPct: partPoss ? partPts / partPoss : null,
    // Plain counts of how many times attendance/participation were actually marked -- unlike
    // attPoss/partPoss above, NOT weighted by a class's max, so this is always a literal
    // number of sessions regardless of which classes those sessions were (used for "times
    // marked" displays, never for a percentage).
    attCount, partCount,
    points: attPts + partPts,
    // Attendance and participation blended into one percentage — used for the Torah/Avoda/GC
    // leaderboards, where a single combined score per category reads more cleanly than two.
    blendedPct: blendedPoss ? (attPts + partPts) / blendedPoss : null,

}

/* Per-class aggregate across a roster, for the same optional date window. */
function classStats(period, roster, opts) {

  roster.forEach((s) => {
    const st = computeStats(s.id, Object.assign({}, opts, { period }));
    attPts += st.attPts; attPoss += st.attPoss; partPts += st.partPts; partPoss += st.partPoss;
    attCount += st.attCount; partCount += st.partCount;

    attPts, attPoss, attPct: attPoss ? attPts / attPoss : null,
    partPts, partPoss, partPct: partPoss ? partPts / partPoss : null,

/* ---------- CSV export ---------- */
function csvCell(v) {

}

    const student = studentById(rec.studentId);

let canWrite = true; // false only if Firebase itself failed to connect

function stashDraft(key, data) { try { sessionStorage.setItem("draft:" + key, JSON.stringify({ data, at: Date.now() })); } catch (e) {} }
function popDraft(key) {
  try {
    const raw = sessionStorage.getItem("draft:" + key);
    if (!raw) return null;
    sessionStorage.removeItem("draft:" + key);
    return JSON.parse(raw).data;
  } catch (e) { return null; }
}
function clearDraft(key) { try { sessionStorage.removeItem("draft:" + key); } catch (e) {} }

async function saveState(newState, opts) {
  opts = opts || {};
  if (opts.stashKey) stashDraft(opts.stashKey, opts.stashData);
  // opts.retry(freshState) -> newState: when given, a conflict (below) doesn't stop and ask
  // the person to press Save again -- it recomputes just this one edit against whatever the
  // fresh server data turned out to be, and writes that instead, up to a few times. This is
  // what makes autosave actually fire-and-forget: with several people marking at once, a
  // conflict here is expected to happen occasionally, and re-deriving the same intended edit
  // from current data is safe as long as the recompute (like per-student attendance patches)
  // only touches what this one action actually changed.
  const maxAttempts = opts.retry ? 5 : 1;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      // Everyone shares one Firestore document, everyone's tab keeps its own in-memory copy
      // of it, and .set() below fully replaces the document -- so without a check here, a
      // tab that's been open a while (its `state` now stale) would silently overwrite
      // whatever anyone else saved in the meantime (e.g. a new staff account another admin
      // just added). `_rev` is a save counter: re-read the server's current value right
      // before writing, and if it's moved past what our copy of `state` was built from,
      // someone else saved first -- pull in their version instead of clobbering it.
      const freshSnap = await STATE_DOC.get();
      const serverRev = freshSnap.exists ? (freshSnap.data()._rev || 0) : 0;
      const ourRev = (state && state._rev) || 0;
      if (freshSnap.exists && serverRev !== ourRev) {
        state = freshSnap.data();
        if (opts.retry && attempt < maxAttempts) {
          newState = opts.retry(state);
          continue;
        }
        toast("Someone else just saved changes, so we didn't overwrite them — we've pulled in the latest data. Please try your save again.", "warn");
        renderAll();
        return { ok: false, code: "conflict" };
      }
      newState._rev = serverRev + 1;
      await STATE_DOC.set(newState);
      // Keep our in-memory copy in sync with what we just saved -- otherwise the next
      // edit in this session would clone the old (pre-save) state and silently undo
      // whatever this save just changed.
      state = newState;
      clearDraft(opts.stashKey);
      return { ok: true };
    } catch (err) {
      return saveStateError(err);
    }
  }
}
function saveStateError(err) {
  const code = err && err.code;
  if (code === "permission-denied") {
    canWrite = false;
    toast("This copy can't save right now -- check your connection, or ask an admin for help.", "warn");
    renderAll();
    return { ok: false, code };
  }
  if (code === "unavailable" || code === "deadline-exceeded") {
    toast("Couldn't reach the server -- check your connection and try again. Your entries are still on screen.", "warn");
    return { ok: false, code };
  }
  toast("Couldn't save (" + (err && err.message ? err.message : "unknown error") + "). Your entries are still on screen -- try again.", "warn");
  return { ok: false, code: code || "error" };
}

  const studentMatch = state.roster.find((s) => (s.username || "").toLowerCase() === u && s.password === password);

/* ---------- toast ---------- */
function toast(msg, kind) {

  if (!wrap) { wrap = document.createElement("div"); wrap.className = "toast-wrap"; document.body.appendChild(wrap); }

  { id: "admin", label: "Admin", icon: "gear", roles: ["admin"] },

function roleOf(session) {

}
function routesFor(session) {
  const role = roleOf(session);
  if (!role) return [];
  return ROUTES.filter((r) => r.roles.includes(role));
}
// The current top-level tab is tracked here, not read fresh from location.hash each time.
// Reason: every successful save re-publishes the page, and the hosting page's own reload of
// that publish clears the URL hash out from under us — if we trusted location.hash as the
// source of truth we'd get bounced back to the first tab (Today) after every single edit
// (e.g. adding or deleting a student). Backed by sessionStorage (not just an in-memory
// variable) in case that reload is a real document reload rather than an in-place render —
// sessionStorage survives a same-tab, same-origin reload; a plain JS variable would not.
// currentRouteId is the source of truth once set; the hash is only consulted to seed it on
// first load (so a direct link like #admin still opens there) — it never overrides an
// already-set route.
const ROUTE_STORAGE_KEY = "tag_route";
let currentRouteId = null;
function currentRoute(session) {
  const avail = routesFor(session);
  if (!avail.length) return null;
  if (currentRouteId && avail.some((r) => r.id === currentRouteId)) return currentRouteId;
  let stored = null;
  try { stored = sessionStorage.getItem(ROUTE_STORAGE_KEY); } catch (e) {}
  if (stored && avail.some((r) => r.id === stored)) { currentRouteId = stored; return currentRouteId; }
  const h = (location.hash || "").replace("#", "");
  currentRouteId = avail.find((r) => r.id === h) ? h : avail[0].id;
  return currentRouteId;
}
function goToRoute(id) {
  currentRouteId = id;
  try { sessionStorage.setItem(ROUTE_STORAGE_KEY, id); } catch (e) {}
  try { if (location.hash !== "#" + id) location.hash = "#" + id; } catch (e) {}
}

 45.9 1.0 41.0 -1.1 40.2 -1.3 C 40.0 -0.6 39.2 4.7 45.4 8.0 Z" fill="currentColor"/><path d="M 41.2 4.6 C 39.9 -2.1 34.7 -2.9 33.9 -2.9 C 33.9 -2.1 34.5 3.1 41.2 4.6 Z" fill="currentColor"/><path d="M 36.4 2.6 C 33.3 -3.4 28.3 -2.7 27.6 -2.5 C 27.7 -1.7 29.7 3.0 36.4 2.6 Z" fill="currentColor"/><path d="M 31.3 54.0 L 38.3 61.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M 32.7 54.0 L 25.7 61.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
/* place: 1 | 2 | 3 for the podium, anything else (or omitted) falls back to plain black/ink --
   "rest" meaning any non-podium use of the wreath (every rank past 3rd, see wreathBadgeHtml),
   since color is reserved for the top 3. */
function wreathColorClass(place) { return place === 1 || place === 2 || place === 3 ? " place-" + place : ""; }
// Gold/silver/bronze gradient stops for the podium wreaths (dark -> mid -> light), matched to a
// reference wreath image so the tone reads as the requested metal at a glance -- the wreath shape
// underneath is still our own original artwork (see WREATH_ICON above), only these three colors
// were sampled from that reference. Every rank past 3rd keeps the flat currentColor/var(--ink)
// look (see wreathSvg below) since it has to stay legible against both light and dark surfaces.
const WREATH_GRADIENT_STOPS = {
  1: ["#EABD02", "#F2CE28", "#F3DA63"], // gold: dark, mid, light
  2: ["#B1B2B4", "#C6C7C8", "#DCDEDF"], // silver
  3: ["#B48261", "#CF9A70", "#D9BC9A"], // bronze
};
let wreathGradientSeq = 0;
// Returns the wreath markup for a given place: for 1/2/3 this swaps every currentColor fill/stroke
// in WREATH_ICON for a per-instance <linearGradient> (a fresh id each call, since several wreath
// badges can be inlined on one page at once and url(#id) references must not collide); anything
// else returns WREATH_ICON untouched so it keeps inheriting color from CSS (theme-aware, dark-mode
// safe) via the surrounding .lb-wreath span.
function wreathSvg(place) {
  const stops = WREATH_GRADIENT_STOPS[place];
  if (!stops) return WREATH_ICON;
  const uid = "lbWreathGrad" + place + "_" + wreathGradientSeq++;
  const defs = '<defs><linearGradient id="' + uid + '" x1="15%" y1="0%" x2="85%" y2="100%">' +
    '<stop offset="0%" stop-color="' + stops[2] + '"/>' +
    '<stop offset="55%" stop-color="' + stops[1] + '"/>' +
    '<stop offset="100%" stop-color="' + stops[0] + '"/>' +
    "</linearGradient></defs>";
  return WREATH_ICON.replace(/currentColor/g, "url(#" + uid + ")").replace(/(<svg[^>]*>)/, "$1" + defs);
}
// "1" -> "1st", "2" -> "2nd", "11" -> "11th", "22" -> "22nd" -- the standard English ordinal
// suffix, needed once ranks start showing inside a wreath seal instead of as a bare number.
function ordinalSuffix(n) {
  const rem100 = n % 100;
  if (rem100 >= 11 && rem100 <= 13) return n + "th";
  if (n % 10 === 1) return n + "st";
  if (n % 10 === 2) return n + "nd";
  if (n % 10 === 3) return n + "rd";
  return n + "th";
}
// A wreath with its place's ordinal (plus a small star for the top 3, matching the podium's
// bigger seal) set right inside its hollow middle. `sizeClass` picks the badge size (see
// .lb-wreath-badge / .lb-wreath-badge-sm); `place` beyond 3 (the ranked list below the podium)
// falls back to a plain black wreath via wreathColorClass.
function wreathBadgeHtml(place, sizeClass, title) {
  const star = place === 1 || place === 2 || place === 3 ? '<svg class="lb-wreath-star" viewBox="0 0 18 18">' + ICONS.sparkle + "</svg>" : "";
  return '<span class="lb-wreath-badge' + (sizeClass ? " " + sizeClass : "") + '"' + (title ? ' title="' + escapeHtml(title) + '"' : "") + ">" +
    '<span class="lb-wreath' + wreathColorClass(place) + '">' + wreathSvg(place) + "</span>" +
    '<span class="lb-wreath-mark">' + star + '<span class="lb-wreath-ordinal">' + ordinalSuffix(place) + "</span></span>" +
    "</span>";
}

/* Collapsible "disclosure" sections, used across the app for content that's genuinely useful
   but that most visits don't need -- Reports' whole-roster weekly sheet, its day-by-day
   calendar, and its CSV export; the Ledger's privilege price list and bulk grant/charge tool.
   Rather than always taking up scroll space (especially painful on a phone, where these
   sections used to stack into one very long page), each one collapses behind a single tap on
   its own header, with a short subtitle so it's clear what's inside before opening it.
   `openSections` is a plain Set of open section ids, kept at module level (not per-page state)
   so it survives the app's usual full-page renderAll() re-renders -- a new section anywhere
   just picks its own id and starts closed like every other one. */
let openSections = new Set();
function collapsibleSectionHtml(id, title, subtitle, bodyHtml) {
  const open = openSections.has(id);
  return '<div class="card collapsible-card" style="margin-top:16px;">' +
    '<button type="button" class="collapsible-toggle" data-collapse="' + escapeHtml(id) + '" aria-expanded="' + (open ? "true" : "false") + '">' +
    '<span class="collapsible-toggle-text"><span class="collapsible-title">' + escapeHtml(title) + "</span>" +
    (subtitle ? '<span class="collapsible-subtitle">' + escapeHtml(subtitle) + "</span>" : "") + "</span>" +
    '<span class="collapsible-chevron">' + icon("chevron") + "</span>" +
    "</button>" +
    (open ? '<div class="collapsible-body">' + bodyHtml + "</div>" : "") +
    "</div>";
}
function wireCollapsibleSections(root) {
  root.querySelectorAll("[data-collapse]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-collapse");
      if (openSections.has(id)) openSections.delete(id); else openSections.add(id);
      renderAll();
    });
  });
}

/* ================================================================
   SHELL
   ================================================================ */
function renderShell(session, previewing) {
  const route = currentRoute(session);
  const navHtml = routesFor(session).map((r) =>
    '<button class="nav-item' + (r.id === route ? " active" : "") + '" data-nav="' + r.id + '">' + icon(r.icon) + "<span>" + r.label + "</span></button>"
  ).join("");
  const modePill = previewing
    ? '<div class="mode-pill"><span class="dot"></span>Previewing — read-only</div>'
    : canWrite
    ? '<div class="mode-pill writer"><span class="dot"></span>Live &amp; editable</div>'
    : '<div class="mode-pill"><span class="dot"></span>Read-only view</div>';
  const person = session.type === "staff" ? session.record.name : (session.record.first + " " + session.record.last);
  const roleLabel = session.type === "staff" ? (session.record.role === "admin" ? "Admin" : "Teacher") : "Student";
  // Your own avatar chip doubles as the button that opens the avatar picker (see
  // renderAvatarPickerModal) -- your own photo if you've picked one, a default face for your
  // role otherwise (see defaultAvatarFor). Inert while previewing someone else, same as the
  // rest of the app's read-only rule there.
  const avatarInner = '<img src="' + escapeHtml(session.record.photoUrl || defaultAvatarFor(session.record)) + '" alt="" />';
  const avatarAttrs = previewing ? " disabled" : ' data-open-avatar-picker="1"';
  const staffBlock = '<div class="staff-chip"><button type="button" class="avatar"' + avatarAttrs + ' title="Change your avatar">' + avatarInner + "</button>" +
    '<div class="info"><div class="name">' + escapeHtml(person) + '</div><div style="font-size:0.68rem;color:var(--muted);">' + roleLabel + '</div></div>' +
    (previewing ? "" : '<button class="switch btn-logout-action" type="button">Log out</button>') + "</div>";
  // Compact version for the mobile topbar (the sidebar it normally lives in is hidden there).
  const mobileUserHtml = '<button type="button" class="avatar"' + avatarAttrs + ' title="' + escapeHtml(person) + " — " + escapeHtml(roleLabel) + '">' + avatarInner + "</button>" +
    (previewing ? "" : '<button class="switch btn-logout-action" type="button">Log out</button>');

  const sidebarHtml =
    '<div class="brand-block"><img src="' + LOGO_DATA_URI + '" alt=""><div class="word">TAG Academy<small>' + escapeHtml(state.meta.schoolYear) + "</small></div></div>" +
    '<nav class="nav">' + navHtml + "</nav>" +
    '<div class="sidebar-foot">' + modePill + staffBlock + "</div>";
  const sidebar = document.getElementById("sidebar");
  if (sidebar) sidebar.innerHTML = sidebarHtml;
  const mobileTabs = document.getElementById("tab-bar");
  if (mobileTabs) mobileTabs.innerHTML = navHtml;
  const topbarUser = document.getElementById("topbar-user");
  if (topbarUser) topbarUser.innerHTML = mobileUserHtml;

  // Unmissable, full-width strip above everything else while previewing -- this is the one
  // way back to the real admin account, so it needs to survive scrolling and be obvious on
  // both desktop and mobile, not just tucked into the sidebar (which is hidden on mobile).
  const bannerEl = document.getElementById("preview-banner");
  if (bannerEl) {
    bannerEl.innerHTML = previewing
      ? '<div class="preview-banner-bar">Previewing as <strong>' + escapeHtml(person) + "</strong> (" + escapeHtml(roleLabel) + ') — nothing you do here is saved. <button type="button" class="btn btn-sm" id="exit-preview-btn">Exit preview</button></div>'
      : "";
    const exitBtn = document.getElementById("exit-preview-btn");
    if (exitBtn) exitBtn.addEventListener("click", exitViewAs);
  }

  document.querySelectorAll("[data-nav]").forEach((btn) => btn.addEventListener("click", () => {
    viewingStudentId = null;
    const id = btn.getAttribute("data-nav");
    goToRoute(id);
    renderAll();
  }));
  document.querySelectorAll(".btn-logout-action").forEach((btn) => btn.addEventListener("click", logout));
  document.querySelectorAll("[data-open-avatar-picker]").forEach((btn) => btn.addEventListener("click", () => { avatarPickerOpen = true; renderAvatarPickerModal(session); }));
  renderAvatarPickerModal(session);
}

/* ---------- avatar picker: tap your own avatar (sidebar or mobile topbar) to pick a face
   from AVATAR_GALLERY, or clear it to go back to plain initials. Self-service only -- there's
   no "set someone else's avatar" path, and it's not offered at all while previewing (see the
   `disabled`/missing data-open-avatar-picker above). ---------- */
let avatarPickerOpen = false;
function renderAvatarPickerModal(session) {
  const root = document.getElementById("avatar-picker-root");
  if (!root) return;
  if (!avatarPickerOpen) { root.innerHTML = ""; return; }
  const current = session.record.photoUrl || defaultAvatarFor(session.record);
  root.innerHTML = '<div class="modal-backdrop" id="avatar-picker-backdrop">' +
    '<div class="modal modal-wide">' +
    "<h2>Choose your avatar</h2>" +
    '<p class="sub">Pick a face to represent you around the app.</p>' +
    '<div class="avatar-picker-grid">' +
    AVATAR_GALLERY.map((uri, i) =>
      '<button type="button" class="avatar-picker-opt' + (current === uri ? " selected" : "") + '" data-avatar-choice="' + i + '" aria-label="Avatar option ' + (i + 1) + '"><img src="' + uri + '" alt="" /></button>'
    ).join("") +
    "</div>" +
    '<div style="display:flex;justify-content:space-between;gap:10px;">' +
    '<button type="button" class="btn btn-ghost btn-sm" id="avatar-clear-btn"' + (session.record.photoUrl ? "" : " disabled") + ">Reset to default</button>" +
    '<button type="button" class="btn btn-ghost btn-sm" id="avatar-cancel-btn">Cancel</button>' +
    "</div></div></div>";
  document.getElementById("avatar-picker-backdrop").addEventListener("click", (evt) => {
    if (evt.target.id === "avatar-picker-backdrop") { avatarPickerOpen = false; renderAvatarPickerModal(session); }
  });
  document.getElementById("avatar-cancel-btn").addEventListener("click", () => { avatarPickerOpen = false; renderAvatarPickerModal(session); });
  const clearBtn = document.getElementById("avatar-clear-btn");
  if (clearBtn) clearBtn.addEventListener("click", () => setMyAvatar(session, null));
  root.querySelectorAll("[data-avatar-choice]").forEach((btn) => btn.addEventListener("click", () => {
    setMyAvatar(session, AVATAR_GALLERY[Number(btn.getAttribute("data-avatar-choice"))]);
  }));
}
async function setMyAvatar(session, url) {
  const newState = JSON.parse(JSON.stringify(state));
  const list = session.type === "staff" ? newState.staff : newState.roster;
  const rec = list.find((r) => r.id === session.record.id);
  if (!rec) return;
  if (url) rec.photoUrl = url; else delete rec.photoUrl;
  const res = await saveState(newState);
  if (res.ok || res.local) {
    avatarPickerOpen = false;
    toast(url ? "Avatar updated." : "Avatar reset to the default.", "good");
    renderAll();
  }
}

/* ================================================================

function renderLogin(root) {

  root.innerHTML =

    '<h1 style="text-align:center;font-size:1.5rem;">TAG Academy</h1>' +
    (isFirstRun
      ? '<p class="sub" style="text-align:center;">No accounts exist yet. Create the first admin account to set everything up.</p>' +
        '<div class="field"><label for="fr-name">Your name</label><input type="text" id="fr-name" placeholder="e.g. Rabbi Katz"></div>' +
        '<div class="field"><label for="fr-username">Username</label><input type="text" id="fr-username" placeholder="e.g. rkatz"></div>' +
        '<div class="field"><label for="fr-password">Password</label>' + passwordFieldHtml("fr-password", { placeholder: "Choose a password" }) + "</div>" +
        '<button class="btn btn-primary" id="fr-submit" style="width:100%;">Create admin account &amp; sign in</button>'
      : '<p class="sub" style="text-align:center;">Sign in with your username and password.</p>' +
        '<div class="field"><label for="lg-username">Username</label><input type="text" id="lg-username" autocomplete="username"></div>' +
        '<div class="field"><label for="lg-password">Password</label>' + passwordFieldHtml("lg-password", { autocomplete: "current-password" }) + "</div>" +
        '<div id="login-error" style="color:var(--warn);font-size:0.82rem;margin-bottom:10px;display:none;">Username or password not recognized.</div>' +
        '<button class="btn btn-primary" id="lg-submit" style="width:100%;">Log in</button>' +
        '<p class="help-text" style="text-align:center;margin-top:14px;">Forgot your password? Ask your teacher or admin to reset it.</p>') +
    "</div></div>";

  wirePasswordToggles(root);
  if (isFirstRun) {
    document.getElementById("fr-submit").addEventListener("click", async () => {
      const name = document.getElementById("fr-name").value.trim();
      const username = document.getElementById("fr-username").value.trim();
      const password = document.getElementById("fr-password").value;
      if (!name || !username || password.length < 4) { toast("Fill in your name, a username, and a password of at least 4 characters.", "warn"); return; }
      const newState = JSON.parse(JSON.stringify(state));
      const id = uid("st");
      newState.staff.push({ id, username, name, password, role: "admin" });
      const res = await saveState(newState);
      if (res.ok || res.local) { setSession("staff", id); goToRoute("today"); renderAll(); }
    });
  } else {
    const submit = async () => {
      const username = document.getElementById("lg-username").value;
      const password = document.getElementById("lg-password").value;
      const match = findByCreds(username, password);
      if (!match) { document.getElementById("login-error").style.display = "block"; return; }
      setSession(match.type, match.id);
      goToRoute(match.type === "student" ? "balance" : "today");
      renderAll();
    };
    document.getElementById("lg-submit").addEventListener("click", submit);
    document.getElementById("lg-password").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  }
}

/* ================================================================
   VIEW: TODAY (attendance entry) — one class at a time, built for speed
   ================================================================ */
let todayDate = (localStorage.getItem(LAST_DATE_KEY) || todayISO());
let selectedPeriod = "";
let showAddExtraPeriod = false;
let showHebrewCal = false;
let todayView = (function () { try { return localStorage.getItem(TODAY_VIEW_KEY) || "compact"; } catch (e) { return "compact"; } })();
// The single most recent Today-page save, kept just long enough to offer one level of Undo --
// { date, period, snapshot: { studentId: prevPairOrUndefined } }, where prevPairOrUndefined is
// exactly what that student's pair[selectedPeriod] was immediately before the save that set
// this (undefined means "didn't exist yet"). Cleared whenever a new save happens (on any
// date/period) since only the very last save is undoable.
let lastSaveUndo = null;
// Per-student autosave bookkeeping for the Today grid -- module-level (not local to one
// wireTodayGrid call) because a successful autosave triggers its own re-render, which tears
// down and rebuilds that closure; keeping these here means an autosave still in flight for one
// student survives a re-render triggered by a different student's autosave finishing a beat
// earlier, instead of losing track of it.
const todayAutosaveInFlight = new Map(); // studentId -> in-flight save promise
const todayAutosavePending = new Map(); // studentId -> latest .student-card element to re-save once current save finishes
function updateTodaySaveStatus() {
  const el = document.getElementById("today-save-status");
  if (!el) return;
  el.textContent = todayAutosaveInFlight.size > 0 ? "Saving…" : "All changes saved";
}

function periodMarkedCount(date, period, roster) {
  return roster.filter((s) => {
    const r = attendanceRecord(date, s.id);
    const pair = r && r.scores && r.scores[period];
    if (!pair) return false;
    // Excused (pair[4]) deliberately has no attendance score (pair[0] is null -- see
    // buildTodayPatch/setExcused) since it's not counted toward attendance %, but it IS a
    // real, deliberate entry for this student/period, so it still counts as "marked" here --
    // otherwise the class/period dropdown's "N/roster marked" undercounts a fully-marked
    // class that includes an excused student.
    return (pair[0] !== null && pair[0] !== undefined) || pair[4] === true;
  }).length;
}

function renderToday(root, session) {
  const periods = periodsForDate(todayDate);
  const roster = activeRoster();
  const teacherName = session.record.name;
  if (!periods.includes(selectedPeriod)) selectedPeriod = periods[0] || "";
  const restored = selectedPeriod ? popDraft("today:" + todayDate + ":" + selectedPeriod) : null;

  const hdayOptions = hebrewDayOptionsFor(todayDate);
  const parshaHebLabel = parshaHebrewFor(todayDate);
  const monthRange = hebrewMonthRangeFor(todayDate);
  const hebLabel = stripHebrewPunct(hebrewDateFor(todayDate));
  const todayGregISO = todayISO();

  let html = '<div class="page-head"><div><span class="eyebrow">Class by class</span><h1>Attendance &amp; Participation</h1>' +
    '<p>Pick a class below, mark each student, and save — then move to the next class as the day goes on.</p></div></div>';

  // Everything below shares one reading-width column on desktop (see .today-wrap in the
  // desktop media query) so the date controls, the class picker, the student list, and the
  // "Today at a glance" summary all line up at the same right edge instead of each block
  // stretching to whatever width its own content happens to need.
  html += '<div class="today-wrap">';

  html += '<div class="today-sticky-bar">';
  html += '<div class="today-head-controls">';
  html += '<div class="thc-row">';
  // The "Today" jump button lives inside the same field as the Gregorian date input (rather
  // than as its own field in .thc-row) so it doesn't compete with the Hebrew-date field for
  // the row's width budget and force an extra wrapped line on a phone -- it just sits on the
  // same line as the date it jumps, to its left.
  html += '<div class="field" style="margin-bottom:0;"><label for="today-date">' + escapeHtml(dayNameFor(todayDate)) + '</label>' +
    '<div style="display:flex;gap:6px;">' +
    '<button type="button" class="btn btn-ghost btn-sm" id="today-jump" style="height:40px;flex-shrink:0;" title="Jump to today">Today</button>' +
    '<input type="date" id="today-date" value="' + todayDate + '" style="flex:1;min-width:0;">' +
    "</div></div>";
  if (hdayOptions.length) {
    html += '<div class="field hcal-field" style="margin-bottom:0;"><label for="hcal-trigger" dir="rtl">' + escapeHtml(hebrewDowLabelFor(todayDate)) + '</label>' +
      '<button type="button" class="hcal-trigger" id="hcal-trigger" dir="rtl">' + escapeHtml(hebLabel || "Pick a date") + "</button>";
    if (showHebrewCal) {
      const firstDow = jsDateFor(hdayOptions[0].date).getDay();
      html += '<div class="hcal-pop" id="hcal-pop">' +
        '<div class="hcal-pop-head">' +
        '<button class="btn btn-ghost btn-sm" id="hmonth-prev" type="button" title="Previous Hebrew month">&larr;</button>' +
        '<span class="hcal-pop-title">' + escapeHtml(monthRange ? monthRange.monthName + " " + monthRange.year : "") + "</span>" +
        '<button class="btn btn-ghost btn-sm" id="hmonth-next" type="button" title="Next Hebrew month">&rarr;</button>' +
        "</div>" +
        '<div class="hcal-grid">' +
        DAY_NAMES.map((n) => '<div class="hcal-dow">' + escapeHtml(n.slice(0, 2)) + "</div>").join("") +
        Array(firstDow).fill('<div class="hcal-cell hcal-blank"></div>').join("") +
        hdayOptions.map((o) => {
          const dayNum = hebrewDayNumeral(o.date) || "?";
          const isSel = o.date === todayDate;
          const isToday = o.date === todayGregISO;
          return '<button type="button" class="hcal-cell hcal-day' + (isSel ? " hcal-sel" : "") + (isToday ? " hcal-today" : "") + '" data-hcal-date="' + o.date + '" title="' + escapeHtml(fmtDateShort(o.date)) + '">' + escapeHtml(dayNum) + "</button>";
        }).join("") +
        "</div></div>";
    }
    html += "</div>";
  }
  html += "</div>"; // .thc-row
  html += "</div>"; // .today-head-controls

  // The class/period selector lives inside the same sticky bar as the date row (when there's
  // actually a class to pick, i.e. periods and roster are both non-empty) so "date and class"
  // stay pinned together while the roster below scrolls -- see .today-sticky-bar above.
  const isExtraToday = selectedPeriod && !(state.settings.schedule[selectedPeriod] || []).includes(dayNameFor(todayDate));
  if (periods.length > 0 && roster.length > 0) {
    html += '<div class="field-row" style="align-items:flex-end;">' +
      '<div class="field" style="max-width:380px;"><label for="period-select">Class / period</label><select id="period-select">';
    periods.forEach((p) => {
      const n = periodMarkedCount(todayDate, p, roster);
      html += '<option value="' + escapeHtml(p) + '"' + (p === selectedPeriod ? " selected" : "") + '>' + escapeHtml(p) + " — " + n + "/" + roster.length + " marked</option>";
    });
    html += "</select></div>";
    if (isExtraToday) {
      html += '<div class="field" style="flex-shrink:0;display:flex;align-items:center;gap:8px;">' +
        '<span class="pill pill-gold">Added just for today</span>' +
        (canWrite ? '<button class="btn btn-ghost btn-sm" id="remove-extra-period" type="button">Remove from today</button>' : "") +
        "</div>";
    }
    html += "</div>";
  }
  html += "</div>"; // .today-sticky-bar

  // Just reflects the selected date, in Hebrew -- no picker, since it's not an independent
  // choice (the date already determines it). Lives outside the (narrow, left-hand)
  // today-head-controls column so it can be centered across the full page width.
  if (parshaHebLabel) html += '<div class="today-parsha-line" dir="rtl">' + escapeHtml(parshaHebLabel) + "</div>";

  if (!canWrite) html += '<div class="banner banner-warn">Read-only view — changes here won’t be saved.</div>';
  if (restored) html += '<div class="banner banner-warn">Your last save may not have gone through (someone else saved first). We’ve restored what you typed below — check it and save again.</div>';

  // "+ Add a class" has two shapes: a single button that sits inline with the other quick
  // actions below, or -- once clicked -- a wider field-row (select, name input, Add/Cancel)
  // that needs its own full-width line instead. extraPeriodButtonHtml is the inline piece;
  // extraPeriodFormHtml (only non-empty while the form is open) renders below the action row.
  const extraPeriodButtonHtml = canWrite && !showAddExtraPeriod
    ? '<button class="btn btn-ghost btn-sm" id="extra-period-open" type="button" title="Add a class just for today">+ Class</button>' : "";
  const extraPeriodFormHtml = canWrite && showAddExtraPeriod ? (() => {
    const otherPeriods = state.settings.periods.filter((p) => !periods.includes(p));
    return '<div class="field-row" style="margin-top:10px;align-items:flex-end;">' +
      '<div class="field" style="min-width:220px;"><label for="extra-period-select">Add a class just for today</label><select id="extra-period-select">' +
      '<option value="">— not on ' + escapeHtml(dayNameFor(todayDate)) + "'s schedule —</option>" +
      otherPeriods.map((p) => '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + "</option>").join("") +
      '<option value="__new__">New one-off class…</option>' +
      "</select></div>" +
      '<div class="field" id="extra-period-new-wrap" style="display:none;min-width:200px;"><label for="extra-period-new">Class name</label><input type="text" id="extra-period-new" placeholder="e.g. Guest Speaker"></div>' +
      '<div class="field" style="flex-shrink:0;display:flex;gap:6px;">' +
      '<button class="btn btn-ghost btn-sm" id="extra-period-add" type="button">Add</button>' +
      '<button class="btn btn-ghost btn-sm" id="extra-period-cancel" type="button">Cancel</button></div>' +
      "</div>" +
      '<p class="help-text" style="margin-top:4px;">This adds the class for ' + escapeHtml(fmtDateShort(todayDate)) + ' only — it won\'t change the regular weekly schedule.</p>';
  })() : "";

  if (periods.length === 0) {
    html += '<div class="empty-state">No periods are scheduled on ' + dayNameFor(todayDate) + '.</div>' +
      (extraPeriodButtonHtml ? '<div style="margin-top:10px;">' + extraPeriodButtonHtml + "</div>" : "") +
      extraPeriodFormHtml + "</div>";
    root.innerHTML = html; wireTodayHeader(root); wireExtraPeriod(root); return;
  }
  if (roster.length === 0) {
    html += '<div class="empty-state">No active students on the roster yet — ask an admin to add them.</div></div>';
    root.innerHTML = html; wireTodayHeader(root); return;
  }

  // Bonus: admin-only toggle, but the "this class is bonus today" pill is visible to whoever's
  // marking it too, so a teacher isn't left guessing why a student's average moved.
  const periodIsBonus = selectedPeriod && isBonusPeriod(todayDate, selectedPeriod);
  const canToggleBonus = canWrite && isAdmin(session);
  const bonusPieceHtml = (periodIsBonus ? '<span class="pill pill-gold" title="Marked scores help this average; a missed or low mark leaves it unchanged.">★ Bonus today — only helps, never hurts</span>' : "") +
    (canToggleBonus ? '<button class="btn btn-ghost btn-sm" id="toggle-bonus" type="button" title="' + (periodIsBonus ? "Unmark " + escapeHtml(selectedPeriod) + " as bonus" : "Mark " + escapeHtml(selectedPeriod) + " as bonus today") + '">' + (periodIsBonus ? "Unmark bonus" : "Mark bonus") + "</button>" : "");

  // A class with a lower max (see periodMaxFor, set in Admin > Schedule) still marks as a full
  // dial/bar when someone's fully present -- that's what makes marking it feel the same as any
  // other class -- but it's worth calling out here, right where the marking happens, that a
  // full mark here is worth less toward the blended average than a normal class.
  const periodMax = selectedPeriod ? periodMaxFor(selectedPeriod) : 1;
  const periodMaxPieceHtml = (selectedPeriod && periodMax !== 1)
    ? '<span class="pill pill-muted" title="A full mark in ' + escapeHtml(selectedPeriod) + ' counts as ' + num2(periodMax) + ' toward the blended average, not a full 1.">Worth up to ' + num2(periodMax) + " pt" + (periodMax === 1 ? "" : "s") + "</span>" : "";

  const fillAllHtml = canWrite ? '<button class="btn btn-ghost btn-sm" id="fill-all" title="Mark whole class present">Mark all present</button>' : "";

  // These three used to each sit on their own stacked line; now they share one row (wrapping
  // on narrow screens) so they read as a single group of quick actions instead of a scroll of
  // separate buttons. The "+ Add a class" form itself, when open, still gets its own full-width
  // line right below -- there's no reasonable way to fit a select + text input inline with these.
  if (bonusPieceHtml || periodMaxPieceHtml || extraPeriodButtonHtml || fillAllHtml) {
    html += '<div class="today-quick-actions">' + periodMaxPieceHtml + bonusPieceHtml + extraPeriodButtonHtml + fillAllHtml + "</div>";
  }
  html += extraPeriodFormHtml;

  const VIEW_LABELS = { cards: "Cards", compact: "Compact" };
  html += '<div class="view-toggle-row"><span class="view-toggle-hint">View</span>' +
    '<div class="view-toggle" role="group" aria-label="Student list view">' +
    Object.keys(VIEW_LABELS).map((v) => '<button type="button" class="today-view-btn' + (todayView === v ? " active" : "") + '" data-view="' + v + '">' + VIEW_LABELS[v] + "</button>").join("") +
    "</div></div>";

  function pairFor(student) {
    const existing = attendanceRecord(todayDate, student.id);
    const draftPair = restored && restored[student.id];
    return draftPair || (existing && existing.scores && existing.scores[selectedPeriod]) || [null, null];
  }
  function markedByBadge(pair) {
    const by = pair[3];
    if (!by) return "";
    return '<span class="marked-by" title="Marked by ' + escapeHtml(by) + '">' + escapeHtml(initialsFor(by)) + "</span>";
  }

  if (todayView === "compact") {
    html += '<div class="student-rows" id="period-entry-body">';
    roster.forEach((student) => {
      const pair = pairFor(student);
      const linked = !(pair[0] !== null && pair[0] !== undefined && pair[1] !== null && pair[1] !== undefined && pair[0] !== pair[1]);
      const note = pair[2] || "";
      const excused = !!pair[4];
      const triState = compactTriState(pair, periodMax);
      html += '<div class="student-card student-row-compact' + (excused ? " is-excused" : "") + '" data-student="' + student.id + '" data-excused="' + (excused ? "1" : "0") + '">';
      html += '<span class="src-name">' + studentLink(student) + markedByBadge(pair) + "</span>";
      // Both the dials and the "Excused" text stay in the DOM always (CSS shows/hides by
      // .is-excused) so the Excused toggle can flip live without rebuilding this row.
      html += '<span class="src-vals">' +
        '<span class="src-val-normal">' +
        compactSlotHtml("att", pair[0], !canWrite, "", periodMax) +
        compactSlotHtml("part", pair[1], !canWrite, 'data-linked="' + (linked ? "1" : "0") + '"', periodMax) +
        "</span>" +
        '<span class="src-val-excused">Excused</span>' +
        "</span>";
      // Quick-mark check/x, replacing the old single "Present" button -- lit up state (see
      // compactTriState) is what makes a blank row visibly different from one marked absent.
      // Tapping a dial above still opens its own slider for partial credit, unchanged.
      html += '<span class="src-actions">' + notePopoverHtml(note, !canWrite) +
        (canWrite ? '<button type="button" class="btn-icon-sm src-check-present' + (triState === "present" ? " active" : "") + '" data-check="present" title="Mark present">&#10003;</button>' : "") +
        (canWrite ? '<button type="button" class="btn-icon-sm src-check-absent' + (triState === "absent" ? " active" : "") + '" data-check="absent" title="Mark absent">&#10007;</button>' : "") +
        (canWrite ? '<button class="btn btn-ghost btn-sm row-excuse' + (excused ? " active" : "") + '" type="button">Exc</button>' : "") +
        "</span>";
      html += "</div>";
    });
    html += "</div>";
    html += '<div class="legend-note"><span><span class="sw" style="background:var(--good)"></span>&#10003; present &nbsp; <span class="sw" style="background:var(--warn)"></span>&#10007; absent &nbsp; Tap a dial to fine-tune · blank = didn’t run</span></div>';
  } else {
    html += '<div class="student-grid" id="period-entry-body">';
    roster.forEach((student) => {
      const pair = pairFor(student);
      const linked = !(pair[0] !== null && pair[0] !== undefined && pair[1] !== null && pair[1] !== undefined && pair[0] !== pair[1]);
      const note = pair[2] || "";
      const excused = !!pair[4];
      html += '<div class="student-card' + (excused ? " is-excused" : "") + '" data-student="' + student.id + '" data-excused="' + (excused ? "1" : "0") + '">';
      html += '<div class="sc-head">' + studentLink(student) + markedByBadge(pair) + '<div class="sc-head-actions">' + notePopoverHtml(note, !canWrite) +
        (canWrite ? '<button class="btn btn-ghost btn-sm row-present" type="button">Present</button>' : "") +
        (canWrite ? '<button class="btn btn-ghost btn-sm row-excuse' + (excused ? " active" : "") + '" type="button">Excused</button>' : "") +
        "</div></div>";
      html += '<div class="excused-note pill pill-muted">Excused — not counted toward attendance</div>';
      html += scorePillHtml("att", pair[0], "Attendance", !canWrite, "", null, periodMax);
      html += scorePillHtml("part", pair[1], "Participation", !canWrite, 'data-linked="' + (linked ? "1" : "0") + '"', null, periodMax);
      html += "</div>";
    });
    html += "</div>";
    html += '<div class="legend-note"><span><span class="sw" style="background:var(--brand)"></span>Tap or slide the bar for a quick mark, or type an exact decimal for partial credit. Blank = didn’t run. Participation copies Attendance until you edit it. Excused clears both scores and leaves them out of attendance %.</span></div>';
  }
  const canUndo = canWrite && lastSaveUndo && lastSaveUndo.date === todayDate && lastSaveUndo.period === selectedPeriod;
  html += '<div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
    '<button class="btn btn-primary" id="save-today"' + (canWrite ? "" : " disabled") + '>Save ' + escapeHtml(selectedPeriod) + "</button>" +
    (canUndo ? '<button class="btn btn-ghost btn-sm" id="undo-last-save" type="button">Undo last save</button>' : "") +
    '<span id="today-save-status" style="font-size:0.8rem;color:var(--muted);"></span></div>';

  // NOTE: there used to be a stray extra `html += "</div>";` right here that closed
  // .today-wrap one statement too early (both roster-view branches above already close their
  // own student-rows/student-grid wrapper) -- browsers silently ignore an orphaned closing tag
  // rather than erroring, so it went unnoticed, but it meant "Today at a glance" below rendered
  // as a sibling of .today-wrap instead of inside it: not just visually narrower than intended
  // (see the comment above on today-wrap's reading-width column), but also why .today-sticky-bar
  // stopped staying pinned once you scrolled past the roster -- position:sticky only holds an
  // element in place for as long as its own parent still has room left to scroll through, and
  // .today-wrap's parent had already ended right there. Removing the stray close (this comment
  // marks where it was) lets .today-wrap -- and the sticky bar inside it -- run the full height
  // of the page, "Today at a glance" included.
  html += renderTodaySummary(todayDate, periods, roster);
  html += "</div>"; // .today-wrap

  root.innerHTML = html;
  wireTodayHeader(root);
  wirePeriodSelect(root);
  wireExtraPeriod(root);
  wireBonusToggle(root);
  wireTodayGrid(root, teacherName);
  wireGlanceCircles(root);
}

/* A read-only circle for the "Today at a glance" table: same fill+color language as
   compactSlotHtml's A/P dials, but no drag/slider -- just a letter that a tap swaps for the
   exact number (see wireGlanceCircles), and swaps back on a second tap. */
function glanceCircleHtml(slot, value, max) {
  const m = Number(max) || 1;
  const label = slot === "att" ? "A" : "P";
  if (value === null || value === undefined) return '<span class="glance-circle-empty">–</span>';
  const pct = circleFillPct(value, m);
  const tone = scoreTone(value, m);
  const toneVar = tone ? ("--circle-color:var(--" + tone + ");") : "";
  return '<button type="button" class="glance-circle" data-label="' + label + '" data-value="' + escapeHtml(num2(value)) + '" style="--fill:' + pct + '%;' + toneVar + '">' +
    '<span class="glance-circle-ring"></span><span class="glance-circle-label">' + label + "</span></button>";
}
function wireGlanceCircles(root) {
  const grid = root.querySelector(".att-grid");
  if (!grid) return;
  grid.addEventListener("click", (evt) => {
    const btn = evt.target.closest(".glance-circle");
    if (!btn || !grid.contains(btn)) return;
    const labelEl = btn.querySelector(".glance-circle-label");
    const revealed = labelEl.classList.toggle("is-revealed");
    labelEl.textContent = revealed ? btn.getAttribute("data-value") : btn.getAttribute("data-label");
  });
}
// Reports' narrow-phone Student column (see .rep-table's white-space:normal rule) lets a long
// "Last, First" wrap to two lines instead of forcing the table to scroll sideways -- but a
// name that wraps makes that row visually taller than its neighbors and is slower to scan.
// So after layout, any name that still doesn't fit on one line gets its first name collapsed
// to just an initial ("Rosenbaum, A.") -- names that already fit on one line are left alone.
// Must run after the table is in the DOM (real layout, not string width guessing) and is a
// no-op wherever white-space stays "nowrap" (desktop/tablet), since nothing wraps there.
function wireCompactStudentNames(root) {
  root.querySelectorAll(".rep-table .student-link[data-first]").forEach((btn) => {
    const last = btn.getAttribute("data-last") || "";
    const first = btn.getAttribute("data-first") || "";
    btn.textContent = last + ", " + first;
    const lineHeight = parseFloat(getComputedStyle(btn).lineHeight) || 16;
    if (btn.scrollHeight > lineHeight * 1.4) {
      btn.textContent = last + ", " + (first ? first.charAt(0) + "." : "");
    }
  });
}

/* Shared cell renderer for every roster×period(s) grid in the app (the "Today at a glance"
   table right below, and the weekly "sheet" views on a student's own page and in Reports) --
   one attendance/participation status for one student, one class, one date. Returns the inner
   HTML for that status, or null when nothing at all was entered (a blank attendance AND no
   note/marked-by) so callers can each decide how to represent "nothing here" -- the Today grid
   shows a plain "—", while the weekly sheets (see weeklySheetCellHtml) go further and
   distinguish "not scheduled" from "scheduled but missed" from "not due yet". */
function attendanceCellHtml(dateStr, period, studentId) {
  const rec = attendanceRecord(dateStr, studentId);
  const pair = rec && rec.scores && rec.scores[period];
  const has = pair && pair[0] !== null && pair[0] !== undefined;
  const hasPart = pair && pair[1] !== null && pair[1] !== undefined;
  const note = pair && pair[2];
  const by = pair && pair[3];
  const excused = pair && !!pair[4];
  const pMax = periodMaxFor(period);
  const meta = (by || note)
    ? '<span class="glance-meta">' +
      (by ? '<span class="marked-by marked-by-sm" title="Marked by ' + escapeHtml(by) + '">' + escapeHtml(initialsFor(by)) + "</span>" : "") +
      (note ? '<span class="note-dot" title="' + escapeHtml(note) + '"></span>' : "") +
      "</span>"
    : "";
  if (excused) return '<span class="att-glance-excused">Excused</span>' + meta;
  if (has || meta) return '<span class="glance-row">' + glanceCircleHtml("att", has ? pair[0] : null, pMax) + glanceCircleHtml("part", has && hasPart ? pair[1] : null, pMax) + meta + "</span>";
  return null;
}
/* Weekly "sheet" cell -- used by both the student's own week view (renderStudentWeekGridHtml)
   and the teacher/admin whole-roster week view in Reports (renderRosterWeekGridHtml). Builds
   on attendanceCellHtml by also covering the two states that only make sense across a whole
   week rather than a single already-selected day: a class that plain wasn't held that day
   (hatched, same visual language as the Reports calendar's "not applicable" cells) versus one
   that was scheduled but nothing's been entered for it -- shown as "Missed" once that day is in
   the past, or a plain "—" for today/a future day so an empty cell for tomorrow doesn't read as
   a missed class. Returns the full <td> markup (class + content) so callers just concatenate. */
function weeklySheetCellHtml(dateStr, period, studentId, extraClass) {
  const cls = extraClass ? " " + extraClass : "";
  if (!periodsForDate(dateStr).includes(period)) {
    return '<td class="score-cell na' + cls + '" title="Not scheduled"></td>';
  }
  const marked = attendanceCellHtml(dateStr, period, studentId);
  if (marked !== null) return '<td class="score-cell' + cls + '">' + marked + "</td>";
  // Scheduled but nothing entered -- left blank rather than labeled "Missed"/"—" so an
  // unmarked cell doesn't read as a flag or a judgment; the hatched "not scheduled" cells
  // above are still visually distinct from a plain blank one.
  return '<td class="score-cell' + cls + '" title="Nothing entered"></td>';
}

function renderTodaySummary(date, periods, roster) {
  let html = '<div class="card card-pad" style="margin-top:18px;"><div class="section-title"><span>Today at a glance</span></div>' +
    '<p style="margin:2px 0 12px;font-size:0.82rem;color:var(--muted);">Every class entered so far for this day — click a class name to jump to it. Tap a circle for the exact number; A/P are colored the same as the marking dials above.</p>';
  html += '<div class="att-grid-scroll"><table class="att-grid"><thead><tr><th style="position:sticky;left:0;background:var(--surface-2);z-index:2;">Student</th>';
  periods.forEach((p) => {
    html += '<th class="' + (p === selectedPeriod ? "col-active" : "") + '"><button type="button" class="summary-period-btn" data-period="' + escapeHtml(p) + '">' + escapeHtml(p) + "</button></th>";
  });
  html += "</tr></thead><tbody>";
  roster.forEach((student) => {
    html += '<tr><td class="student-cell">' + studentLink(student) + "</td>";
    periods.forEach((p) => {
      const text = attendanceCellHtml(date, p, student.id);
      html += '<td class="num' + (p === selectedPeriod ? " col-active" : "") + '">' + (text === null ? "—" : text) + "</td>";
    });
    html += "</tr>";
  });
  html += "</tbody></table></div></div>";
  return html;
}

/* Keeps .today-sticky-bar (the date row + class picker on the Today tab) pinned right below
   the mobile topbar+tab-bar instead of at the very top of the viewport -- both of those are
   0px tall on desktop (they're display:none there), so this naturally collapses to "stick at
   the top of the page" on a wide screen. Also toggles a bottom border once the bar is actually
   pinned (rather than just sitting in its normal spot) so it reads as "floating" over the
   content scrolling underneath rather than blending into it. Registered once as a scroll/resize
   listener (see below) rather than per-render, and re-run from wireTodayHeader after every
   render since the bar's own height (and thus whether it's "stuck" yet) can change with it. */
function syncStickyBarOffset() {
  const bar = document.querySelector(".today-sticky-bar");
  if (!bar) return;
  const topbar = document.getElementById("topbar-mobile");
  const tabbar = document.getElementById("tab-bar");
  const offset = (topbar ? topbar.offsetHeight : 0) + (tabbar ? tabbar.offsetHeight : 0);
  bar.style.top = offset + "px";
  const rect = bar.getBoundingClientRect();
  bar.classList.toggle("is-stuck", Math.round(rect.top) <= offset);
}
window.addEventListener("scroll", syncStickyBarOffset, { passive: true });
window.addEventListener("resize", syncStickyBarOffset);

function wireTodayHeader(root) {
  syncStickyBarOffset();
  const dateInput = document.getElementById("today-date");

  const todayJumpBtn = document.getElementById("today-jump");

  const hcalTrigger = document.getElementById("hcal-trigger");

  const hmonthNext = document.getElementById("hmonth-next");

function wirePeriodSelect(root) {

function wireBonusToggle(root) {

    const list = newState.settings.bonusPeriods[date] || [];

    const res = await saveState(newState);
