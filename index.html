function wireExtraPeriod(root) {
  const openBtn = document.getElementById("extra-period-open");
  if (openBtn) openBtn.addEventListener("click", () => { showAddExtraPeriod = true; renderAll(); });
  const cancelBtn = document.getElementById("extra-period-cancel");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { showAddExtraPeriod = false; renderAll(); });
  const sel = document.getElementById("extra-period-select");
  const newWrap = document.getElementById("extra-period-new-wrap");
  if (sel) sel.addEventListener("change", () => {
    if (newWrap) newWrap.style.display = sel.value === "__new__" ? "" : "none";
  });
  const addBtn = document.getElementById("extra-period-add");
  if (addBtn) addBtn.addEventListener("click", async () => {
    const selVal = sel ? sel.value : "";
    let name = "";
    if (selVal === "__new__") {
      const inp = document.getElementById("extra-period-new");
      name = inp ? inp.value.trim() : "";
    } else {
      name = selVal;
    }
    if (!name) { toast("Pick or type a class name first.", "warn"); return; }
    const newState = JSON.parse(JSON.stringify(state));
    if (!newState.settings.periods.includes(name)) {
      newState.settings.periods.push(name);
      newState.settings.schedule[name] = newState.settings.schedule[name] || [];
    }
    if (!newState.settings.extraPeriods) newState.settings.extraPeriods = {};
    if (!newState.settings.extraPeriods[todayDate]) newState.settings.extraPeriods[todayDate] = [];
    if (!newState.settings.extraPeriods[todayDate].includes(name)) newState.settings.extraPeriods[todayDate].push(name);
    const res = await saveState(newState);
    if (res.ok || res.local) { selectedPeriod = name; showAddExtraPeriod = false; toast("Added " + name + " for today.", "good"); renderAll(); }
  });
  const removeBtn = document.getElementById("remove-extra-period");
  if (removeBtn) removeBtn.addEventListener("click", async () => {
    const name = selectedPeriod;
    const newState = JSON.parse(JSON.stringify(state));
    if (newState.settings.extraPeriods && newState.settings.extraPeriods[todayDate]) {
      newState.settings.extraPeriods[todayDate] = newState.settings.extraPeriods[todayDate].filter((p) => p !== name);
    }
    const res = await saveState(newState);
    if (res.ok || res.local) { selectedPeriod = ""; toast("Removed " + name + " from today.", "good"); renderAll(); }
  });
}
function wireTodayGrid(root, teacherName) {
  const body = document.getElementById("period-entry-body");
  if (!body) return;
  // Every card on this page marks the same currently-selected class, so one max (see
  // periodMaxFor) covers every input wired below -- "present" means "at this class's max",
  // whatever that is, not literally 1.
  const periodMax = periodMaxFor(selectedPeriod);
  // Dragging a dial/bar to a value doesn't "commit" until the pointer lifts -- that's when
  // this fires, so a drag saves itself once at the end instead of on every intermediate
  // pointermove tick. (scheduleAutosave is declared further down but hoisted -- see its
  // definition for why that's safe -- since it's only actually invoked once a drag finishes,
  // well after this whole function has run.)
  wirePillTracks(body, (input) => {
    const card = input.closest(".student-card");
    if (card) scheduleAutosave(card);
  });
  wireNotePopovers(body);
  // Closing a note (tapping "Done") is the one interaction on this page that reads as
  // "finished entering that" -- so it saves the whole class immediately, the same as pressing
  // the main Save button, instead of silently leaving the note unsaved until some later click.
  // performTodaySave is declared further down (function declarations hoist), and this only
  // wires the notes that actually have a "Done" button (read-only cards don't render one).
  body.querySelectorAll(".note-popover-close").forEach((btn) => {
    btn.addEventListener("click", () => performTodaySave());
  });
  // Compact view shows small dials (.src-circle) instead of the full draggable bar, so
  // whatever changes the real inputs needs to keep a dial's fill -- and its score-based tone
  // -- in sync. In Cards view there's no .src-circle on the card, so this is a harmless no-op
  // there.
  function updateSrcCircles(card) {
    const attInp = card.querySelector('.score-input[data-slot="att"]');
    const partInp = card.querySelector('.score-input[data-slot="part"]');
    const setCircle = (circle, input) => {
      if (!circle || !input) return;
      const v = input.value === "" ? null : Math.max(0, Math.min(periodMax, Number(input.value) || 0));
      circle.style.setProperty("--fill", circleFillPct(v, periodMax) + "%");
      const tone = v === null ? "" : scoreTone(v, periodMax);
      if (tone) circle.style.setProperty("--circle-color", "var(--" + tone + ")");
      else circle.style.removeProperty("--circle-color");
    };
    setCircle(card.querySelector(".src-circle-att"), attInp);
    setCircle(card.querySelector(".src-circle-part"), partInp);
  }
  // Compact's quick-mark check/x buttons mirror whatever the real inputs and the card's
  // excused flag currently say -- called after every change so a blank row (neither lit up)
  // never gets confused with one marked absent (0), which is the whole point of having them
  // at all (computeStats already excludes true blanks from both the numerator and
  // denominator; see its own comment).
  function syncCheckButtons(card) {
    const presentBtn = card.querySelector(".src-check-present");
    const absentBtn = card.querySelector(".src-check-absent");
    if (!presentBtn && !absentBtn) return;
    const attInp = card.querySelector('.score-input[data-slot="att"]');
    const partInp = card.querySelector('.score-input[data-slot="part"]');
    const a = attInp && attInp.value !== "" ? Number(attInp.value) : null;
    const p = partInp && partInp.value !== "" ? Number(partInp.value) : null;
    const state = compactTriState([a, p, null, null, card.dataset.excused === "1"], periodMax);
    if (presentBtn) presentBtn.classList.toggle("active", state === "present");
    if (absentBtn) absentBtn.classList.toggle("active", state === "absent");
  }
  body.querySelectorAll(".student-card").forEach((card) => {
    const studentId = card.getAttribute("data-student");
    const attInp = card.querySelector('.score-input[data-slot="att"]');
    const partInp = card.querySelector('.score-input[data-slot="part"]');
    // Excused is mutually exclusive with having a real score -- typing/sliding a value or
    // marking present/absent clears it, and turning it on clears any scores, so the two
    // states can never disagree about whether this student counts toward attendance %.
    const setExcused = (on) => {
      card.classList.toggle("is-excused", on);
      card.dataset.excused = on ? "1" : "0";
      const excuseBtn = card.querySelector(".row-excuse");
      if (excuseBtn) excuseBtn.classList.toggle("active", on);
      syncCheckButtons(card);
    };
    if (attInp && partInp) {
      const syncPart = () => {
        if (partInp.dataset.linked !== "0") { partInp.value = attInp.value; refreshPillForInput(partInp); }
        refreshPillForInput(attInp);
        updateSrcCircles(card);
        if (attInp.value !== "") setExcused(false); else syncCheckButtons(card);
      };
      attInp.addEventListener("input", syncPart);
      attInp.addEventListener("blur", () => { const v = clampScore(attInp.value, periodMax); attInp.value = v === null ? "" : v; syncPart(); scheduleAutosave(card); });
      partInp.addEventListener("input", () => { partInp.dataset.linked = "0"; refreshPillForInput(partInp); updateSrcCircles(card); if (partInp.value !== "") setExcused(false); else syncCheckButtons(card); });
      partInp.addEventListener("blur", () => { const v = clampScore(partInp.value, periodMax); partInp.value = v === null ? "" : v; refreshPillForInput(partInp); updateSrcCircles(card); syncCheckButtons(card); scheduleAutosave(card); });
    }
    const presentBtn = card.querySelector(".row-present");
    if (presentBtn) presentBtn.addEventListener("click", () => {
      if (attInp) { attInp.value = String(periodMax); refreshPillForInput(attInp); }
      if (partInp) { partInp.value = String(periodMax); partInp.dataset.linked = "1"; refreshPillForInput(partInp); }
      updateSrcCircles(card);
      setExcused(false);
      scheduleAutosave(card);
    });
    const excuseBtn = card.querySelector(".row-excuse");
    if (excuseBtn) excuseBtn.addEventListener("click", () => {
      const turningOn = card.dataset.excused !== "1";
      if (turningOn) {
        if (attInp) { attInp.value = ""; refreshPillForInput(attInp); }
        if (partInp) { partInp.value = ""; refreshPillForInput(partInp); }
        updateSrcCircles(card);
      }
      setExcused(turningOn);
      scheduleAutosave(card);
    });
    // Compact's dials: tap the circle to reveal its slider right there in the row. Only one
    // open at a time (across the whole page), closed by tapping elsewhere -- see the
    // document-level listener near the note-popover one, below.
    card.querySelectorAll(".src-circle").forEach((btn) => {
      btn.addEventListener("click", (evt) => {
        evt.stopPropagation();
        if (btn.disabled) return;
        const wrap = btn.closest(".src-slot");
        if (!wrap) return;
        const willOpen = !wrap.classList.contains("is-open");
        document.querySelectorAll(".src-slot.is-open").forEach((w) => { if (w !== wrap) w.classList.remove("is-open"); });
        wrap.classList.toggle("is-open", willOpen);
      });
    });
    // Compact's quick-mark check/x, replacing the old single Present button -- tapping the
    // already-active one clears back to blank, tapping the other sets that state. Both set
    // attendance AND participation together at 1/0; partial credit for the two separately
    // stays available by tapping a dial above to open its slider.
    const checkPresentBtn = card.querySelector(".src-check-present");
    if (checkPresentBtn) checkPresentBtn.addEventListener("click", () => {
      const v = checkPresentBtn.classList.contains("active") ? "" : String(periodMax);
      if (attInp) { attInp.value = v; refreshPillForInput(attInp); }
      if (partInp) { partInp.value = v; partInp.dataset.linked = "1"; refreshPillForInput(partInp); }
      updateSrcCircles(card);
      setExcused(false);
      scheduleAutosave(card);
    });
    const checkAbsentBtn = card.querySelector(".src-check-absent");
    if (checkAbsentBtn) checkAbsentBtn.addEventListener("click", () => {
      const v = checkAbsentBtn.classList.contains("active") ? "" : "0";
      if (attInp) { attInp.value = v; refreshPillForInput(attInp); }
      if (partInp) { partInp.value = v; partInp.dataset.linked = "1"; refreshPillForInput(partInp); }
      updateSrcCircles(card);
      setExcused(false);
      scheduleAutosave(card);
    });
  });
  const fillAllBtn = document.getElementById("fill-all");
  if (fillAllBtn) fillAllBtn.addEventListener("click", () => {
    body.querySelectorAll(".student-card").forEach((card) => {
      const attInp = card.querySelector('.score-input[data-slot="att"]');
      const partInp = card.querySelector('.score-input[data-slot="part"]');
      if (attInp && attInp.value === "") { attInp.value = String(periodMax); refreshPillForInput(attInp); }
      if (partInp && partInp.value === "") { partInp.value = String(periodMax); if (!partInp.dataset.linked) partInp.dataset.linked = "1"; refreshPillForInput(partInp); }
      updateSrcCircles(card);
      syncCheckButtons(card);
    });
    toast("Filled every blank score with " + num2(periodMax) + " — adjust any exceptions, then save.", "good");
  });

  // Builds the Firestore patch for either every visible card (bulk Save / note "Done") or
  // just one student (per-tap autosave), reading `base` (whatever state it's handed -- the
  // in-memory `state`, or fresher data handed back on a conflict) rather than the module-level
  // `state` directly, so the exact same function can be re-run against fresh server data on
  // retry without duplicating this logic.
  function buildTodayPatch(base, onlyCard) {
    const newState = JSON.parse(JSON.stringify(base));
    const draftForStash = {};
    const undoSnapshot = {};
    const cards = onlyCard ? [onlyCard] : body.querySelectorAll(".student-card");
    cards.forEach((card) => {
      const studentId = card.getAttribute("data-student");
      const attInp = card.querySelector('.score-input[data-slot="att"]');
      const partInp = card.querySelector('.score-input[data-slot="part"]');
      const noteInp = card.querySelector('.note-input');
      const note = noteInp ? noteInp.value.trim() : "";
      const excused = card.dataset.excused === "1";
      const pair = [clampScore(attInp ? attInp.value : "", periodMax), clampScore(partInp ? partInp.value : "", periodMax), note];
      if (excused) pair[4] = true;
      draftForStash[studentId] = pair;
      // What this student's pair looked like right before this save -- captured from `base`
      // (the last-known server data at the time of this attempt), not `newState`, so Undo
      // can put it back exactly and "unchanged" (below) compares against the real prior value.
      const priorRec = base.attendance.find((r) => r.date === todayDate && r.studentId === studentId);
      const priorPair = priorRec && priorRec.scores && priorRec.scores[selectedPeriod];
      undoSnapshot[studentId] = priorPair ? JSON.parse(JSON.stringify(priorPair)) : undefined;
      let rec = newState.attendance.find((r) => r.date === todayDate && r.studentId === studentId);
      if (!rec) { rec = { id: uid("a"), date: todayDate, studentId, scores: {}, notes: "" }; newState.attendance.push(rec); }
      // Excused-with-no-score still needs to be *saved* (not treated as "nothing entered"),
      // otherwise it would get silently dropped from rec.scores right back to unmarked.
      if (pair[0] === null && pair[1] === null && !note && !excused) {
        delete rec.scores[selectedPeriod];
      } else {
        // Multiple staff can mark the same class (one opens after another has already marked
        // some students) -- only claim credit for students THIS save actually changed. A
        // student whose att/part/note/excused come out identical to what they already were
        // keeps whoever's initials were on them before, instead of getting overwritten just
        // because the same class got saved again.
        const priorExcused = !!(priorPair && priorPair[4]);
        const unchanged = priorPair && priorPair[0] === pair[0] && priorPair[1] === pair[1] &&
          (priorPair[2] || "") === (pair[2] || "") && priorExcused === excused;
        pair[3] = unchanged ? (priorPair[3] || teacherName) : teacherName;
        rec.scores[selectedPeriod] = pair;
      }
      // Record-level enteredBy/enteredAt stay as "who last touched this student's record"
      // (used in CSV exports); pair[3] above is the per-period marker shown in the UI, since
      // different staff can mark different classes for the same student on the same day.
      rec.enteredBy = teacherName; rec.enteredAt = Date.now();
    });
    return { newState, draftForStash, undoSnapshot };
  }

  // Only one save per student in flight at a time -- if more taps land on the same student
  // while a save is already on the wire, don't fire a second overlapping request (that's its
  // own way to trip the _rev conflict check against yourself); just remember to run once more
  // when the current one finishes, which re-reads the card's now-current DOM values anyway.
  // (todayAutosaveInFlight/todayAutosavePending live at module scope, not as locals here --
  // see their declaration for why.)
  async function autosaveStudent(card) {
    const first = buildTodayPatch(state, card);
    const studentId = card.getAttribute("data-student");
    const res = await saveState(first.newState, {
      stashKey: "today:" + todayDate + ":" + selectedPeriod + ":" + studentId,
      stashData: first.draftForStash,
      retry: (fresh) => buildTodayPatch(fresh, card).newState,
    });
    if (res.ok || res.local) {
      lastSaveUndo = { date: todayDate, period: selectedPeriod, snapshot: first.undoSnapshot };
      // Deliberately no per-tap toast -- with several people marking at once a toast for
      // every single check/x would be constant noise; the status line above the grid (and the
      // "marked by" initials that show up on re-render) is enough confirmation. Deferred
      // (not an immediate renderAll()) so finishing this student's save doesn't yank the page
      // out from under someone still mid-interaction with a different student's row.
      refreshViewOrDefer();
    } else {
      const el = document.getElementById("today-save-status");
      if (el) el.textContent = "Couldn't save that change — check your connection.";
    }
  }
  function scheduleAutosave(card) {
    const studentId = card.getAttribute("data-student");
    if (todayAutosaveInFlight.has(studentId)) { todayAutosavePending.set(studentId, card); updateTodaySaveStatus(); return; }
    const run = (c) => {
      updateTodaySaveStatus();
      const p = autosaveStudent(c).finally(() => {
        todayAutosaveInFlight.delete(studentId);
        if (todayAutosavePending.has(studentId)) {
          const next = todayAutosavePending.get(studentId);
          todayAutosavePending.delete(studentId);
          run(next);
        } else updateTodaySaveStatus();
      });
      todayAutosaveInFlight.set(studentId, p);
    };
    run(card);
  }

  const saveBtn = document.getElementById("save-today");
  if (!saveBtn) return;
  saveBtn.addEventListener("click", performTodaySave);

  // Kept as a manual "sync everything now" fallback -- every check/x/dial/note already
  // autosaves itself the moment it changes (see scheduleAutosave above), so this button and
  // its "Saving…" state are a safety net, not the only way a mark gets saved.
  async function performTodaySave() {
    saveBtn.disabled = true;
    const statusElNow = document.getElementById("today-save-status");
    if (statusElNow) statusElNow.textContent = "Saving…";
    const first = buildTodayPatch(state);
    const res = await saveState(first.newState, {
      stashKey: "today:" + todayDate + ":" + selectedPeriod,
      stashData: first.draftForStash,
      retry: (fresh) => buildTodayPatch(fresh).newState,
    });
    if (res.ok || res.local) {
      // Without this, the button stayed disabled and the status text stuck on "Saving…"
      // until some unrelated click forced a re-render -- a real save had gone through, it
      // just never told you. Re-rendering immediately shows the updated "x/y marked" count,
      // the just-saved "marked by" initials, etc.
      lastSaveUndo = { date: todayDate, period: selectedPeriod, snapshot: first.undoSnapshot };
      toast("Saved " + selectedPeriod + ".", "good");
      renderAll();
    } else {
      saveBtn.disabled = false;
      const el = document.getElementById("today-save-status");
      if (el) el.textContent = "Not saved — see message above.";
    }
  }

  const undoBtn = document.getElementById("undo-last-save");
  if (undoBtn) undoBtn.addEventListener("click", async () => {
    if (!lastSaveUndo) return;
    undoBtn.disabled = true;
    const { date, period, snapshot } = lastSaveUndo;
    const newState = JSON.parse(JSON.stringify(state));
    Object.keys(snapshot).forEach((studentId) => {
      let rec = newState.attendance.find((r) => r.date === date && r.studentId === studentId);
      const prior = snapshot[studentId];
      if (prior === undefined) {
        if (rec && rec.scores) delete rec.scores[period];
      } else {
        if (!rec) { rec = { id: uid("a"), date, studentId, scores: {}, notes: "" }; newState.attendance.push(rec); }
        rec.scores[period] = prior;
      }
    });
    const res = await saveState(newState);
    if (res.ok || res.local) {
      lastSaveUndo = null;
      toast("Undid the last save for " + period + ".", "good");
      renderAll();
    } else {
      undoBtn.disabled = false;
    }
  });
}

function coinBadge(size) {

}
// "My Balance" is a student viewing their own record -- the exact same rich page a staff
// member sees when they open a student from the roster (coin balance, attendance/participation
// for whatever range you pick, the day-by-day calendar with click-to-drill-in, the by-class
// breakdown, the report-card narrative, and the log), just headed as their own page instead of
// someone else's. See renderStudentDetail's opts.self handling for what's different.
function renderMyBalance(root, session) {

}
function statTile(label, value, tone) {
  return '<div class="stat-tile"><div class="label">' + escapeHtml(label) + '</div><div class="value' + (tone ? " " + tone : "") + '">' + value + "</div></div>";
}
function txPill(type) {

  return '<span class="pill ' + cls + '">' + escapeHtml(type) + "</span>";

/* ================================================================
   VIEW: TAG COINS
   ================================================================ */
// The main flow here is "select one or more students, then Grant or Purchase/charge" -- tap a
// student's card below to toggle it in/out of selectedCoinStudents, and as soon as at least
// one is selected an action panel appears offering the two things you'd ever do with a coin
// balance. coinActionMode remembers which of those two is open; ledgerCart/ledgerCartTotal/
// ledgerCartNote (tapping a privilege onto the current purchase) work exactly as before, just
// applied to however many students are selected instead of always exactly one.
let selectedCoinStudents = new Set();
let coinActionMode = null; // null | "grant" | "purchase"
let ledgerCart = []; // [{ id, name, cost }] -- privileges tapped onto the current purchase
function ledgerCartTotal() { return ledgerCart.reduce((sum, item) => sum + Number(item.cost || 0), 0); }
function ledgerCartNote() { return ledgerCart.map((item) => item.name).join(", "); }

function renderLedger(root, session) {
  const roster = activeRoster();
  const privs = state.settings.privileges || [];
  selectedCoinStudents.forEach((id) => { if (!roster.some((s) => s.id === id)) selectedCoinStudents.delete(id); });
  const selCount = selectedCoinStudents.size;

  let html = '<div class="page-head"><div style="display:flex;gap:14px;align-items:center;">' + coinBadge("lg") +
    '<div><span class="eyebrow">Everyone’s balance</span><h1>TAG Coins</h1>' +
    '<p>Tap a student — or several — below to grant or charge TAG coins. Coins earned from Attendance &amp; Participation are calculated automatically and already count toward every balance shown here.</p></div></div></div>';

  // ---- Student coin cards: the whole roster's balance, at a glance, and the entry point for
  // every grant/charge below (see selectedCoinStudents above). ----
  html += '<div class="card card-pad" style="margin-bottom:16px;">';
  if (roster.length === 0) {
    html += '<p class="help-text" style="margin:0;">No active students on the roster yet.</p>';
  } else {
    html += '<div class="coin-card-grid">' + roster.map((s) => {
      const bal = studentStats(s.id).balance;
      const isSel = selectedCoinStudents.has(s.id);
      return '<button type="button" class="coin-card' + (isSel ? " selected" : "") + '"' + (canWrite ? "" : " disabled") +
        ' data-coin-student="' + s.id + '" aria-pressed="' + (isSel ? "true" : "false") + '">' +
        '<span class="coin-card-check">' + icon("check") + "</span>" +
        avatarHtml(s, "lb-avatar-md") +
        '<span class="coin-card-name">' + fullName(s) + "</span>" +
        '<span class="coin-card-balance">' + coinBadge("sm") + '<span class="coin-card-balance-value">' + num2(bal) + "</span></span>" +
        "</button>";
    }).join("") + "</div>";
  }
  html += "</div>";

  // ---- Selection action panel: only appears once something's selected, and offers exactly
  // the two things you'd do with a coin balance -- grant, or charge/purchase. ----
  if (canWrite && selCount > 0) {
    let actionBody = '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">' +
      '<div style="font-weight:800;">' + selCount + " student" + (selCount === 1 ? "" : "s") + " selected</div>" +
      '<button type="button" class="btn btn-ghost btn-sm" id="coin-sel-clear">Clear selection</button></div>';
    actionBody += '<div class="bubble-group" style="margin-bottom:16px;">' +
      '<button type="button" class="bubble-btn' + (coinActionMode === "grant" ? " active" : "") + '" data-coin-mode="grant">Grant coins</button>' +
      '<button type="button" class="bubble-btn' + (coinActionMode === "purchase" ? " active" : "") + '" data-coin-mode="purchase">Purchase / charge</button></div>';
    if (coinActionMode === "grant" || coinActionMode === "purchase") {
      const isPurchase = coinActionMode === "purchase";
      if (isPurchase && privs.length) {
        actionBody += '<div class="field"><label>Tap an item to add it</label><div class="price-chip-row">' +
          privs.map((p) => {
            const inCart = ledgerCart.some((item) => item.id === p.id);
            return '<button type="button" class="price-chip' + (inCart ? " active" : "") + '" data-price-item="' + p.id + '">' + escapeHtml(p.name) + ' <span class="price-chip-cost">' + num2(p.cost) + "</span></button>";
          }).join("") + "</div></div>";
      }
      if (isPurchase && ledgerCart.length) {
        actionBody += '<div class="cart-list">' + ledgerCart.map((item, i) =>
          '<span class="cart-chip">' + escapeHtml(item.name) + " (" + num2(item.cost) + ')<button type="button" class="cart-remove" data-cart-remove="' + i + '" aria-label="Remove">&times;</button></span>'
        ).join("") + '<button type="button" class="btn btn-ghost btn-sm" id="cart-clear">Clear</button></div>';
      }
      actionBody += '<div class="field-row">' +
        '<div class="field"><label for="coin-date">Date</label><input type="date" id="coin-date" value="' + todayISO() + '"></div>' +
        '<div class="field"><label for="coin-amount">Amount</label><input type="number" min="0" step="0.5" id="coin-amount" value="' + (isPurchase && ledgerCart.length ? ledgerCartTotal() : "") + '" placeholder="0"></div>' +
        "</div>" +
        '<div class="field"><label for="coin-note">Note</label><input type="text" id="coin-note" value="' + (isPurchase ? escapeHtml(ledgerCartNote()) : "") + '" placeholder="' + (isPurchase ? "e.g. late lights-out" : "e.g. Chanukah bonus") + '"></div>' +
        '<button class="btn btn-primary" id="coin-action-submit">' + (isPurchase ? "Log purchase" : "Grant coins") + " — apply to " + selCount + " student" + (selCount === 1 ? "" : "s") + "</button>";
    }
    html += '<div class="card card-pad" style="margin-bottom:16px;border-color:var(--brand);">' + actionBody + "</div>";
  }

  if (canWrite) {
    // Transfers are real but rare (moving coins from one student to another), so they get
    // their own small, out-of-the-way section instead of complicating the select-cards flow
    // above, which is built around applying one entry to a group, not moving value between
    // two specific people.
    let transferBody;
    if (roster.length < 2) {
      transferBody = '<p class="help-text">Need at least two active students to transfer between.</p>';
    } else {
      transferBody = '<div class="field-row">' +
        '<div class="field"><label for="tr-date">Date</label><input type="date" id="tr-date" value="' + todayISO() + '"></div>' +
        '<div class="field"><label for="tr-from">From</label><select id="tr-from">' + roster.map((s) => '<option value="' + s.id + '">' + fullName(s) + "</option>").join("") + "</select></div>" +
        '<div class="field"><label for="tr-to">To</label><select id="tr-to">' + roster.map((s) => '<option value="' + s.id + '">' + fullName(s) + "</option>").join("") + "</select></div>" +
        '<div class="field"><label for="tr-amount">Amount</label><input type="number" min="0" step="0.5" id="tr-amount" placeholder="0"></div>' +
        "</div>" +
        '<div class="field"><label for="tr-note">Note</label><input type="text" id="tr-note" placeholder="e.g. traded for a sticker"></div>' +
        '<button class="btn btn-primary btn-sm" id="tr-submit">Transfer</button>';
    }
    html += collapsibleSectionHtml("coinTransfer", "Transfer between students", "Move coins from one student straight to another", transferBody);
  } else {
    html += '<div class="banner banner-warn">Read-only view — you can see TAG coin balances but not change them.</div>';
  }

  if (privs.length) {
    const privBody = '<div class="table-wrap"><table><thead><tr><th>Privilege</th><th class="num">Cost</th></tr></thead><tbody>' +
      privs.map((p) => "<tr><td>" + escapeHtml(p.name) + '</td><td class="num">' + num2(p.cost) + "</td></tr>").join("") + "</tbody></table></div>";
    html += collapsibleSectionHtml("ledgerPrivs", "Privilege price list", null, privBody);
  }

  const rows = state.ledger.slice().sort((a, b) => (b.enteredAt || 0) - (a.enteredAt || 0));
  html += '<div class="card card-pad" style="margin-top:16px;"><div class="section-title">All entries (' + rows.length + ")</div>";
  if (rows.length === 0) {
    html += '<div class="empty-state">No entries yet.</div>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Student</th><th>Type</th><th class="num">Amount</th><th>Note</th><th>Entered by</th></tr></thead><tbody>';
    rows.forEach((tx) => {
      const student = studentById(tx.studentId);
      const out = tx.type === "Spent/Redeemed" || tx.type === "Transfer Out";
      html += "<tr><td>" + fmtDateShort(tx.date) + "</td><td>" + (student ? studentLink(student) : "—") + "</td><td>" + txPill(tx.type) +
        '</td><td class="num" style="font-weight:700;color:' + (out ? "var(--warn)" : "var(--gold)") + ';">' + (out ? "−" : "+") + num2(tx.amount) + "</td><td>" + escapeHtml(tx.note || "") + "</td><td>" + escapeHtml(tx.enteredBy || "") + "</td></tr>";
    });
    html += "</tbody></table></div>";
  }
  html += "</div>";
  root.innerHTML = html;

  root.querySelectorAll("[data-coin-student]").forEach((btn) => {
    if (btn.disabled) return;
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-coin-student");
      if (selectedCoinStudents.has(id)) selectedCoinStudents.delete(id); else selectedCoinStudents.add(id);
      renderAll();
    });
  });
  const clearSelBtn = document.getElementById("coin-sel-clear");
  if (clearSelBtn) clearSelBtn.addEventListener("click", () => { selectedCoinStudents = new Set(); coinActionMode = null; ledgerCart = []; renderAll(); });
  root.querySelectorAll("[data-coin-mode]").forEach((btn) => btn.addEventListener("click", () => {
    const mode = btn.getAttribute("data-coin-mode");
    coinActionMode = coinActionMode === mode ? null : mode;
    renderAll();
  }));
  root.querySelectorAll("[data-price-item]").forEach((chip) => {
    chip.addEventListener("click", () => {
      const id = chip.getAttribute("data-price-item");
      const idx = ledgerCart.findIndex((item) => item.id === id);
      if (idx !== -1) {
        ledgerCart.splice(idx, 1);
      } else {
        const priv = privs.find((p) => p.id === id);
        if (priv) ledgerCart.push({ id: priv.id, name: priv.name, cost: priv.cost });
      }
      renderAll();
    });
  });
  root.querySelectorAll("[data-cart-remove]").forEach((btn) => {
    btn.addEventListener("click", () => {
      ledgerCart.splice(Number(btn.getAttribute("data-cart-remove")), 1);
      renderAll();
    });
  });
  const cartClearBtn = document.getElementById("cart-clear");
  if (cartClearBtn) cartClearBtn.addEventListener("click", () => { ledgerCart = []; renderAll(); });

  const coinSubmitBtn = document.getElementById("coin-action-submit");
  if (coinSubmitBtn) coinSubmitBtn.addEventListener("click", async () => {
    const ids = Array.from(selectedCoinStudents);
    if (ids.length === 0) { toast("Select at least one student.", "warn"); return; }
    const date = document.getElementById("coin-date").value;
    const amount = Number(document.getElementById("coin-amount").value);
    const note = document.getElementById("coin-note").value.trim();
    if (!date || !amount || amount <= 0) { toast("Pick a date and a positive amount.", "warn"); return; }
    const type = coinActionMode === "purchase" ? "Spent/Redeemed" : "Manual Grant";
    // A charge can't push anyone's balance negative -- rather than blocking the whole batch
    // over one student who's short, apply it to everyone who can afford it and report who got
    // skipped, so e.g. charging the whole roster for a trip still works for the 28 kids who can
    // cover it even if 2 can't.
    const applied = [], skipped = [];
    ids.forEach((id) => {
      if (type === "Spent/Redeemed") {
        const bal = studentStats(id).balance;
        if (amount > bal) { const s = studentById(id); skipped.push(s ? s.last + ", " + s.first : id); return; }
      }
      applied.push(id);
    });
    if (applied.length === 0) { toast("No one selected has enough balance for that charge.", "warn"); return; }
    coinSubmitBtn.disabled = true;
    const newState = JSON.parse(JSON.stringify(state));
    const enteredAt = Date.now();
    applied.forEach((id) => { newState.ledger.push({ id: uid("l"), date, studentId: id, type, amount, note, enteredBy: session.record.name, enteredAt }); });
    const res = await saveState(newState, { stashKey: "coins:action", stashData: { date, type, amount, note, ids: applied } });
    if (res.ok || res.local) {
      selectedCoinStudents = new Set();
      coinActionMode = null;
      ledgerCart = [];
      toast(
        (type === "Manual Grant" ? "Granted to " : "Charged ") + applied.length + " student" + (applied.length === 1 ? "" : "s") + "." +
        (skipped.length ? " Skipped " + skipped.length + " with insufficient balance: " + skipped.join(", ") + "." : ""),
        skipped.length ? "warn" : "good"
      );
      renderAll();
    } else {
      coinSubmitBtn.disabled = false;
    }
  });

  const trSubmitBtn = document.getElementById("tr-submit");
  if (trSubmitBtn) trSubmitBtn.addEventListener("click", async () => {
    const date = document.getElementById("tr-date").value;
    const fromId = document.getElementById("tr-from").value;
    const toId = document.getElementById("tr-to").value;
    const amount = Number(document.getElementById("tr-amount").value);
    const note = document.getElementById("tr-note").value.trim();
    if (!date || !amount || amount <= 0) { toast("Pick a date and a positive amount.", "warn"); return; }
    if (fromId === toId) { toast("Pick two different students.", "warn"); return; }
    const bal = studentStats(fromId).balance;
    if (amount > bal) {
      const s = studentById(fromId);
      toast((s ? s.last + ", " + s.first : "That student") + "’s balance is only " + num2(bal) + " — can’t transfer out " + num2(amount) + ".", "warn");
      return;
    }
    trSubmitBtn.disabled = true;
    const newState = JSON.parse(JSON.stringify(state));
    const enteredAt = Date.now();
    newState.ledger.push({ id: uid("l"), date, studentId: fromId, type: "Transfer Out", amount, note, enteredBy: session.record.name, enteredAt });
    newState.ledger.push({ id: uid("l"), date, studentId: toId, type: "Transfer In", amount, note, enteredBy: session.record.name, enteredAt });
    const res = await saveState(newState, { stashKey: "coins:transfer", stashData: { date, fromId, toId, amount, note } });
    if (res.ok || res.local) { toast("Transferred " + num2(amount) + ".", "good"); renderAll(); }
    else { trSubmitBtn.disabled = false; }
  });
}

/* ================================================================
   VIEW: REPORTS (by student or by class, all time / week / Hebrew month)
   ================================================================ */
let reportGroupBy = "student"; // "student" | "class"
let reportScope = "all"; // "all" | "week" | "hmonth" | "custom"
let reportAnchor = todayISO();
let reportFrom = todayISO();
let reportTo = todayISO();
// The Reports page's whole-school "day by day" calendar -- its own Hebrew-month anchor and
// class filter, independent of the table above (which has its own time-range picker).
let repCalAnchor = todayISO();
let repCalClassFilter = null;
// The Reports page's whole-roster weekly "sheet" (see renderRosterWeekGridHtml) -- its own
// week anchor and single-class filter, independent of everything else on the page. A weekly
// sheet only reads cleanly for one class at a time (rows are students, so there's no room left
// to also break each row out by class the way the student's own weekly view does), hence the
// dropdown instead of "every class combined".
let repWeekAnchor = todayISO();
let repWeekPeriod = null;
let exportScope = "hmonth"; // "today" | "week" | "hmonth" | "hyear" | "all" | "custom"
let exportAnchor = todayISO();
let exportFrom = todayISO();
let exportTo = todayISO();

function exportRange() {
  if (exportScope === "today") return { from: exportAnchor, to: exportAnchor, label: fmtDateShort(exportAnchor) };
  if (exportScope === "week") {
    const r = weekRangeFor(exportAnchor);
    return { from: r.from, to: r.to, label: fmtDateShort(r.from) + " – " + fmtDateShort(r.to) };
  }
  if (exportScope === "hmonth") {
    const r = hebrewMonthRangeFor(exportAnchor);
    if (!r) return { from: null, to: null, label: "" };
    return { from: r.from, to: r.to, label: r.monthName + " " + r.year + " (" + fmtDateShort(r.from) + " – " + fmtDateShort(r.to) + ")" };
  }
  if (exportScope === "hyear") {
    const r = hebrewYearRangeFor(exportAnchor);
    if (!r) return { from: null, to: null, label: "" };
    return { from: r.from, to: r.to, label: "Hebrew year " + r.year + " (" + fmtDateShort(r.from) + " – " + fmtDateShort(r.to) + ")" };
  }
  if (exportScope === "custom") {
    const from = exportFrom <= exportTo ? exportFrom : exportTo;
    const to = exportFrom <= exportTo ? exportTo : exportFrom;
    return { from, to, label: fmtDateShort(from) + " – " + fmtDateShort(to) };
  }
  return { from: null, to: null, label: "Since the start of the year" };
}

function reportRange() {
  if (reportScope === "week") {
    const r = weekRangeFor(reportAnchor);
    const parsha = parshaFor(r.from);
    return { from: r.from, to: r.to, title: parsha || ("Week of " + fmtDateShort(r.from)), sub: fmtDateShort(r.from) + " – " + fmtDateShort(r.to) };
  }
  if (reportScope === "hmonth") {
    const r = hebrewMonthRangeFor(reportAnchor);
    if (!r) return { from: null, to: null, title: "This month", sub: "" };
    return { from: r.from, to: r.to, title: r.monthName + " " + r.year, sub: fmtDateShort(r.from) + " – " + fmtDateShort(r.to) };
  }
  if (reportScope === "custom") {
    const from = reportFrom <= reportTo ? reportFrom : reportTo;
    const to = reportFrom <= reportTo ? reportTo : reportFrom;
    return { from, to, title: "Custom range", sub: fmtDateShort(from) + " – " + fmtDateShort(to) };
  }
  return { from: null, to: null, title: "All time", sub: "Since the start of the year" };
}

/* Reports page's whole-school day-by-day calendar -- same look and grid as the student-detail
   one (renderStudentCalendarHtml), but each cell blends the WHOLE roster instead of one
   student, so an admin/teacher can spot a rough day for the school at a glance. Reuses the
   .sd-cal-* classes for visual consistency; only the element ids/data attributes differ so its
   wiring doesn't collide with the student-detail calendar's. Clicking a day jumps the table
   above into that single day via the existing Custom-range machinery. */
function renderReportsCalendarHtml() {
  const monthRange = hebrewMonthRangeFor(repCalAnchor);
  const hdayOptions = hebrewDayOptionsFor(repCalAnchor);
  if (!monthRange || !hdayOptions.length) return ""; // Hebrew calendar library unavailable
  const firstDow = jsDateFor(hdayOptions[0].date).getDay();
  const todayGregISO = todayISO();
  const roster = activeRoster();
  const periods = state.settings.periods;

  let html = '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">' +
    '<div class="field" style="min-width:180px;margin-bottom:0;"><label for="rep-cal-class">Class</label><select id="rep-cal-class">' +
    '<option value=""' + (!repCalClassFilter ? " selected" : "") + '>All classes</option>' +
    periods.map((p) => '<option value="' + escapeHtml(p) + '"' + (repCalClassFilter === p ? " selected" : "") + '>' + escapeHtml(p) + "</option>").join("") +
    "</select></div></div>";

  html += '<div class="sd-cal-nav">' +
    '<button class="btn btn-ghost btn-sm" id="rep-cal-prev" type="button" title="Previous Hebrew month">&larr;</button>' +
    '<span class="sd-cal-title">' + escapeHtml(monthRange.monthName + " " + monthRange.year) + "</span>" +
    '<button class="btn btn-ghost btn-sm" id="rep-cal-next" type="button" title="Next Hebrew month">&rarr;</button>' +
    '<button class="btn btn-ghost btn-sm" id="rep-cal-today" type="button">This month</button>' +
    "</div>";

  html += '<div class="sd-cal-grid">' +
    DAY_NAMES.map((n) => '<div class="sd-cal-dow">' + escapeHtml(n.slice(0, 2)) + "</div>").join("") +
    Array(firstDow).fill('<div class="sd-cal-cell sd-cal-blank"></div>').join("") +
    hdayOptions.map((o) => {
      const dayPct = rosterDayBlendedPct(roster, o.date, repCalClassFilter);
      const hasData = dayPct !== null && dayPct !== undefined;
      const tone = hasData ? pctTone(dayPct) : "";
      const isToday = o.date === todayGregISO;
      const isSel = reportScope === "custom" && reportFrom === o.date && reportTo === o.date;
      const gregDay = jsDateFor(o.date).getDate();
      const hebNum = hebrewDayNumeral(o.date) || "";
      const titleText = fmtDateLong(o.date) + (hasData ? " — " + pct(dayPct) : repCalClassFilter ? " — not held / not marked" : " — nothing entered");
      return '<button type="button" class="sd-cal-cell sd-cal-day' + (tone ? " tone-" + tone : " sd-cal-empty") +
        (isToday ? " sd-cal-today" : "") + (isSel ? " sd-cal-sel" : "") + '" data-rep-cal-date="' + o.date + '" title="' + escapeHtml(titleText) + '">' +
        '<span class="sd-cal-day-top"><span class="sd-cal-greg">' + gregDay + '</span><span class="sd-cal-heb">' + escapeHtml(hebNum) + "</span></span>" +
        (hasData ? '<span class="sd-cal-val">' + Math.round(dayPct * 100) + "%</span>" : "") +

    }).join("") +

  html += '<p class="help-text" style="margin-top:10px;">Each day blends attendance and participation across the whole roster' +
    (repCalClassFilter ? " for " + escapeHtml(repCalClassFilter) : " and every class held that day") +
    '. Click a day to jump the table above to just that day.</p>';
  return html;
}

/* The teacher/admin-facing counterpart to a student's own "Week at a glance" sheet
   (renderStudentWeekGridHtml) -- same idea, but with the axes swapped: rows are the whole
   active roster, columns are the 7 days of the picked week, and since a roster-wide sheet
   doesn't have room to also break every row out by class, one class is picked at a time (see
   the "Class / period" dropdown in renderOverview). Reuses weeklySheetCellHtml so "marked" /
   "missed" / "not scheduled" read identically to the student-facing version. */
function renderRosterWeekGridHtml(roster, period, weekFrom) {
  const days = Array.from({ length: 7 }, (_, i) => shiftDate(weekFrom, i));
  const todayGregISO = todayISO();
  let html = '<div class="att-grid-scroll"><table class="att-grid"><thead><tr><th style="position:sticky;left:0;background:var(--surface-2);z-index:2;">Student</th>';
  days.forEach((d, i) => {
    html += '<th class="' + (d === todayGregISO ? "col-active" : "") + '"><span class="period-name">' + escapeHtml(DAY_NAMES[i].slice(0, 3)) +
      '</span><br><span class="sub">' + escapeHtml(fmtDateShort(d)) + "</span></th>";
  });
  html += "</tr></thead><tbody>";
  roster.forEach((s) => {
    html += '<tr><td class="student-cell">' + studentLink(s) + "</td>";
    days.forEach((d) => { html += weeklySheetCellHtml(d, period, s.id, d === todayGregISO ? "col-active" : ""); });
    html += "</tr>";
  });
  html += "</tbody></table></div>";
  return html;
}

/* ================================================================
   VIEW: LEADERBOARD (everyone can see this one, including students)
   ================================================================ */
const LEADERBOARD_CATEGORIES = [
  { id: "attendance", label: "Attendance" },
  { id: "participation", label: "Participation" },
  { id: "torah", label: "Torah" },
  { id: "avoda", label: "Avoda" },
  { id: "gc", label: "Gemilas Chassidim" },
  { id: "coins", label: "TAG Coins" },
];
let lbCategory = "attendance";
let lbScope = "all"; // "all" | "week" | "hmonth" | "custom"
let lbAnchor = todayISO();
let lbFrom = todayISO();
let lbTo = todayISO();
let lbAgeBand = "all"; // "all" or an ageBandFor().label string

function lbRange() {
  if (lbScope === "week") {
    const r = weekRangeFor(lbAnchor);
    return { from: r.from, to: r.to, title: "This week", sub: fmtDateShort(r.from) + " – " + fmtDateShort(r.to) };
  }
  if (lbScope === "hmonth") {
    const r = hebrewMonthRangeFor(lbAnchor);
    if (!r) return { from: null, to: null, title: "This month", sub: "" };
    return { from: r.from, to: r.to, title: r.monthName + " " + r.year, sub: fmtDateShort(r.from) + " – " + fmtDateShort(r.to) };
  }
  if (lbScope === "custom") {
    const from = lbFrom <= lbTo ? lbFrom : lbTo;
    const to = lbFrom <= lbTo ? lbTo : lbFrom;
    return { from, to, title: "Custom range", sub: fmtDateShort(from) + " – " + fmtDateShort(to) };
  }
  return { from: null, to: null, title: "All time", sub: "Since the start of the year" };
}
/* One student's raw value + a formatted display string for a given leaderboard category —
   the single place that ties each category id to the stat that ranks it. */
function leaderboardEntryFor(studentId, catId, range) {
  if (catId === "attendance") { const st = computeStats(studentId, { from: range.from, to: range.to }); return { value: st.attPct, display: pct(st.attPct) }; }
  if (catId === "participation") { const st = computeStats(studentId, { from: range.from, to: range.to }); return { value: st.partPct, display: pct(st.partPct) }; }
  if (catId === "coins") { const st = computeStats(studentId, { from: range.from, to: range.to }); return { value: st.balance, display: num2(st.balance) }; }
  // torah / avoda / gc — a blended attendance+participation percentage across every class
  // tagged with that category (see categoryFor / PERIOD_CATEGORIES, set in Admin > Schedule).
  const st = computeStats(studentId, { from: range.from, to: range.to, category: catId });
  return { value: st.blendedPct, display: pct(st.blendedPct) };
}
/* A student's avatar -- initials in a colored circle today, but built so a real photo can
   slot in later without touching any caller: the moment a student record has a photoUrl, this
   is the one place that switches to rendering it. The background color is picked from a small
   fixed palette by hashing the student's id, so a given student's color stays the same across
   renders/sessions without storing anything extra. */
const AVATAR_PALETTE = ["#2f6fed", "#7c3aed", "#0e9488", "#d6396b", "#c2780c", "#2f8558", "#a3781f", "#5b5fc7"];
function avatarColorFor(id) {
  let h = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function studentInitials(student) { return initialsFor(student.first + " " + student.last); }
// Works for a student record (first/last) or a staff record (a single name field) --
// avatarHtml below uses this so the same function renders either kind of person. Only reached
// as a last-resort fallback now that everyone always has a real avatar image (see
// defaultAvatarFor) -- kept so a person record missing everything still renders something.
function personInitials(person) {
  if (person && (person.first !== undefined || person.last !== undefined)) return studentInitials(person);
  return initialsFor((person && person.name) || "");
}
function isStudentRecord(person) { return !!(person && (person.first !== undefined || person.last !== undefined)); }
// New accounts start with a real avatar picture, not blank initials -- one default face for
// every student and a different one for every staff member, picked from AVATAR_GALLERY (see
// setMyAvatar/renderAvatarPickerModal). Anyone can still change theirs later; this only decides
// what shows up before they've made a choice of their own.
function defaultAvatarFor(person) { return isStudentRecord(person) ? DEFAULT_STUDENT_AVATAR : DEFAULT_STAFF_AVATAR; }
function avatarHtml(student, sizeClass) {
  const cls = "lb-avatar" + (sizeClass ? " " + sizeClass : "");
  const url = student.photoUrl || defaultAvatarFor(student);
  if (url) return '<span class="' + cls + '" style="background:var(--surface-2);"><img src="' + escapeHtml(url) + '" alt="" /></span>';
  return '<span class="' + cls + '" style="background:' + avatarColorFor(student.id) + ';">' + escapeHtml(personInitials(student)) + "</span>";
}
const PODIUM_ORDINALS = ["1st", "2nd", "3rd"];
/* Standard "competition ranking": students tied on value share the same rank, and the rank
   right after a tie skips ahead by however many people just shared it (1, 1, 3 — not 1, 2, 3),
   the same convention leaderboards and races use. `sortedDesc` must already be sorted by value,
   highest first. */
function competitionRanks(sortedDesc) {
  const ranks = [];
  sortedDesc.forEach((e, i) => { ranks.push(i > 0 && e.value === sortedDesc[i - 1].value ? ranks[i - 1] : i + 1); });
  return ranks;
}
function renderLeaderboard(root, session) {

  const cat = LEADERBOARD_CATEGORIES.find((c) => c.id === lbCategory) || LEADERBOARD_CATEGORIES[0];

  let html = '<div class="page-head"><div><span class="eyebrow">Everyone, ranked</span><h1>Leaderboard</h1>' +
    "<p>Attendance, participation, Torah, Avoda, Gemilas Chassidim, and TAG coins — ranked for the whole roster, or narrowed to one age group.</p></div></div>";

  html += '<div class="admin-tabs lb-cat-tabs">' + LEADERBOARD_CATEGORIES.map((c) =>
    '<button class="admin-tab' + (lbCategory === c.id ? " active" : "") + '" data-lbcat="' + c.id + '">' + escapeHtml(c.label) + "</button>"
  ).join("") + "</div>";

  html += '<div class="card card-pad" style="margin-bottom:16px;"><div class="field-row">' +
    '<div class="field" style="min-width:170px;"><label for="lb-scope">Time range</label><select id="lb-scope">' +
    '<option value="all"' + (lbScope === "all" ? " selected" : "") + '>All time</option>' +
    '<option value="week"' + (lbScope === "week" ? " selected" : "") + '>This week</option>' +
    '<option value="hmonth"' + (lbScope === "hmonth" ? " selected" : "") + '>This Hebrew month</option>' +
    '<option value="custom"' + (lbScope === "custom" ? " selected" : "") + '>Custom range</option>' +
    "</select></div>" +
    (lbScope === "week" || lbScope === "hmonth" ? '<div class="field" style="flex-shrink:0;min-width:auto;"><label>&nbsp;</label><div style="display:flex;gap:6px;flex-wrap:wrap;">' +
      '<button class="btn btn-ghost btn-sm" id="lb-prev" type="button">&larr;</button>' +
      '<button class="btn btn-ghost btn-sm" id="lb-today" type="button">Today</button>' +
      '<button class="btn btn-ghost btn-sm" id="lb-next" type="button">&rarr;</button></div></div>' : "") +
    (lbScope === "custom" ? '<div class="field" style="min-width:150px;"><label for="lb-from">From</label><input type="date" id="lb-from" value="' + escapeHtml(lbFrom) + '"></div>' +
      '<div class="field" style="min-width:150px;"><label for="lb-to">To</label><input type="date" id="lb-to" value="' + escapeHtml(lbTo) + '"></div>' : "") +
    '<div class="field" style="min-width:170px;"><label for="lb-age">Age group</label><select id="lb-age">' +
    '<option value="all"' + (lbAgeBand === "all" ? " selected" : "") + '>All ages</option>' +
    bands.map((b) => '<option value="' + escapeHtml(b.label) + '"' + (lbAgeBand === b.label ? " selected" : "") + '>Ages ' + escapeHtml(b.label) + "</option>").join("") +
    "</select></div>" +
    "</div>";
  if (lbScope === "week" || lbScope === "hmonth") {
    html += '<div style="margin-top:2px;font-family:var(--font-display);font-weight:800;font-size:1.1rem;">' + escapeHtml(range.title) + "</div>" +
      '<div style="font-size:0.82rem;color:var(--muted);margin-top:2px;">' + escapeHtml(range.sub) + "</div>";
  }
  if (!bands.length) {
    html += '<p class="help-text" style="margin:10px 0 0;">No students have a year of birth on file yet — add one in Admin &gt; Students to unlock age-group boards.</p>';
  }
  html += "</div>";

  // Rank every active student (in the selected age band, if any) by this category's value,
  // dropping anyone with no data at all in this category/range rather than showing them tied
  // at the bottom looking like a real 0%.
  const inBand = lbAgeBand === "all" ? roster : roster.filter((s) => {
    const band = ageBandFor(ageForYearOfBirth(s.yearOfBirth));
    return band && band.label === lbAgeBand;
  });
  const entries = inBand.map((s) => Object.assign({ student: s }, leaderboardEntryFor(s.id, cat.id, range)));
  const ranked = entries.filter((e) => e.value !== null && e.value !== undefined).sort((a, b) => b.value - a.value);
  const noData = entries.length - ranked.length;

  html += '<div class="card card-pad">';
  if (!ranked.length) {
    html += '<p class="help-text" style="margin:0;">Nobody has data for ' + escapeHtml(cat.label) + (lbAgeBand !== "all" ? " in the ages " + escapeHtml(lbAgeBand) + " group" : "") + " yet.</p>";
  } else {
    const ranks = competitionRanks(ranked);
    const nameHtmlFor = (student, cls) => (role === "admin" || role === "teacher")
      ? '<button type="button" class="student-link ' + cls + '" data-student-link="' + student.id + '">' + fullName(student) + "</button>"
      : '<span class="' + cls + '">' + fullName(student) + "</span>";
    const valueHtmlFor = (display, bigClass) => cat.id === "coins"
      ? '<span class="coin-inline">' + coinBadge("sm") + '<span style="font-weight:800;color:var(--gold);">' + display + "</span></span>"
      : '<span class="' + bigClass + '">' + display + "</span>";
    // The podium's 3 places are the top 3 DISTINCT values, not the top 3 rank numbers -- a
    // 5-way tie for 1st still leaves a 2nd and 3rd place open for whoever comes next, exactly
    // like a real awards podium (the trophy for 2nd place doesn't disappear just because 1st
    // was crowded). This is deliberately different from the rank NUMBER shown in the list below
    // (competitionRanks, skip-ahead: 1,1,1,1,1,6,6,6,9…) -- that skip-ahead number is what a
    // student's own rank badge should say once they're off the podium, but it's not what decides
    // who gets a place ON the podium in the first place.
    const distinctValues = [];
    ranked.forEach((e) => { if (!distinctValues.length || distinctValues[distinctValues.length - 1] !== e.value) distinctValues.push(e.value); });
    const podiumGroups = distinctValues.slice(0, 3).map((v, i) => ({
      place: i + 1,
      entries: ranked.filter((e) => e.value === v),
    }));
    const onPodium = new Set();
    podiumGroups.forEach((g) => g.entries.forEach((e) => onPodium.add(e)));
    const listEntries = ranked.map((e, i) => ({ e: e, rank: ranks[i] })).filter((x) => !onPodium.has(x.e));

    if (podiumGroups.length) {
      // 2nd/1st/3rd left-to-right like a real podium -- only when all three places are actually
      // in play; with fewer (a small roster, or ties eating into the distinct-value count) they
      // render in plain place order instead.
      const order = podiumGroups.length === 3 ? [podiumGroups[1], podiumGroups[0], podiumGroups[2]] : podiumGroups;
      // A tied group only shows ONE avatar on the riser (there's only room for one). Prefer the
      // signed-in student when they're actually part of that tie, so the board feels personal to
      // whoever's looking at it; otherwise just take whoever sorts first in the group -- stable
      // across re-renders (no reason for the picture to change every time the page redraws), and
      // every student in the group is still credited by name in .lb-podium-names either way, so
      // nobody in a crowded 1st place is left out of the credit, just off the little picture.
      const signedInId = session.type === "student" ? session.record.id : null;
      const pickPodiumAvatar = (g) => (signedInId && g.entries.find((e) => e.student.id === signedInId)) || g.entries[0];
      // The podium figure is a plain (non-circular) cutout, not the circular lb-avatar used
      // everywhere else -- see .lb-podium-figure.
      const podiumFigureHtml = (student) => '<img class="lb-podium-figure" src="' + escapeHtml(student.photoUrl || defaultAvatarFor(student)) + '" alt="" />';
      html += '<div class="lb-podium">';
      order.forEach((g) => {
        html += '<div class="lb-podium-col rank-' + g.place + '">' +
          wreathBadgeHtml(g.place, "", ordinalSuffix(g.place) + " place") +
          podiumFigureHtml(pickPodiumAvatar(g).student) +
          "</div>";
      });
      html += "</div>";
      html += '<div class="lb-podium-info-row">';
      order.forEach((g) => {
        const names = g.entries.map((e) => nameHtmlFor(e.student, "")).join(", ");
        html += '<div class="lb-podium-info rank-' + g.place + '">' +
          valueHtmlFor(g.entries[0].display, "lb-podium-value") +
          '<div class="lb-podium-names">' + names + "</div>" +
          "</div>";
      });
      html += "</div>";
    }
    if (listEntries.length) {
      // Set apart from the podium in its own panel, with a small "more below" chevron pinned to
      // its top edge (see .lb-list-panel / .lb-list-arrow) rather than just continuing straight
      // down from the podium.
      html += '<div class="lb-list-panel"><span class="lb-list-arrow">' + icon("chevron") + '</span><div class="lb-list">';
      listEntries.forEach((x) => {
        html += '<div class="lb-row">' + avatarHtml(x.e.student, "") +
          '<div class="lb-row-main">' + nameHtmlFor(x.e.student, "lb-row-name") + valueHtmlFor(x.e.display, "lb-row-value") + "</div>" +
          wreathBadgeHtml(x.rank, "lb-wreath-badge-sm lb-row-rank", "Rank " + x.rank) +
          "</div>";
      });
      html += "</div></div>";
    }
  }
  if (noData > 0) {
    html += '<p class="help-text" style="margin:12px 0 0;">' + noData + " student" + (noData === 1 ? "" : "s") + " with no " + escapeHtml(cat.label.toLowerCase()) + " record yet in this range" + (lbAgeBand !== "all" ? " and age group" : "") + " — not shown above.</p>";
  }
  html += "</div>";

  root.innerHTML = html;

  root.querySelectorAll("[data-lbcat]").forEach((btn) => btn.addEventListener("click", () => { lbCategory = btn.getAttribute("data-lbcat"); renderAll(); }));
  const ageSel = document.getElementById("lb-age");
  if (ageSel) ageSel.addEventListener("change", () => { lbAgeBand = ageSel.value; renderAll(); });
  const scopeSel = document.getElementById("lb-scope");
  if (scopeSel) scopeSel.addEventListener("change", () => { lbScope = scopeSel.value; renderAll(); });
  const prevBtn = document.getElementById("lb-prev");
  if (prevBtn) prevBtn.addEventListener("click", () => { lbAnchor = lbScope === "week" ? shiftDate(lbAnchor, -7) : shiftHebrewMonth(lbAnchor, -1); renderAll(); });
  const nextBtn = document.getElementById("lb-next");
  if (nextBtn) nextBtn.addEventListener("click", () => { lbAnchor = lbScope === "week" ? shiftDate(lbAnchor, 7) : shiftHebrewMonth(lbAnchor, 1); renderAll(); });
  const todayBtn = document.getElementById("lb-today");
  if (todayBtn) todayBtn.addEventListener("click", () => { lbAnchor = todayISO(); renderAll(); });
  const fromInput = document.getElementById("lb-from");
  if (fromInput) fromInput.addEventListener("change", () => { lbFrom = fromInput.value || lbFrom; renderAll(); });
  const toInput = document.getElementById("lb-to");
  if (toInput) toInput.addEventListener("change", () => { lbTo = toInput.value || lbTo; renderAll(); });
}

function renderAdminSchedule(root) {
  let html = '<div class="card card-pad"><div class="section-title">Weekly class schedule</div>' +
    '<p class="help-text">Check every day a period runs, or rename a class right in its row. Add a class below, or remove one that’s no longer used — past attendance for a removed class is kept, not deleted, and comes back if you add a class with the exact same name again. Renaming a class keeps its past attendance under the new name.</p>';
  html += '<div class="field-row" style="align-items:flex-end;max-width:480px;">' +
    '<div class="field" style="flex:1;"><label for="np-name">New class name</label><input type="text" id="np-name" placeholder="e.g. Chavrusa"></div>' +
    '<div class="field" style="flex-shrink:0;"><button class="btn btn-ghost btn-sm" id="np-add" type="button">Add class</button></div></div>';
  html += '<p class="help-text" style="margin-top:-6px;">The order below is the order classes appear in every dropdown (Today’s Class/period picker, reports, etc.) — drag the handle to reorder. Category controls which Leaderboard(s) a class counts toward — Torah, Avoda, or Gemilas Chassidim classes are combined into one score there; “Other” classes still count toward the overall Attendance/Participation boards. Max score is what a full mark in that class is worth — most classes are a normal 1, but a shorter or supplementary class can be set lower (e.g. 0.3 or 0.1) so it counts for proportionally less of a student’s blended average.</p>';
  html += '<div class="table-wrap"><table><thead><tr><th style="width:36px;">Order</th><th class="sticky-col-l" style="min-width:150px;">Period</th><th style="min-width:212px;">Category</th><th style="min-width:100px;">Max score</th>' + DAY_NAMES.map((d) => "<th>" + d.slice(0, 3) + "</th>").join("") + "<th></th></tr></thead><tbody>";
  state.settings.periods.forEach((p, i) => {
    html += '<tr data-period-row="' + escapeHtml(p) + '"><td style="white-space:nowrap;">' +
      '<button class="btn btn-ghost btn-sm drag-handle" type="button" data-drag-handle title="Drag to reorder">⠿</button>' +
      "</td>";
    html += '<td class="sticky-col-l"><input type="text" class="period-name-input" data-original="' + escapeHtml(p) + '" value="' + escapeHtml(p) + '"></td>';
    const currentCat = categoryFor(p);
    html += '<td><select class="period-category-input" data-original="' + escapeHtml(p) + '">' +
      PERIOD_CATEGORIES.map((c) => '<option value="' + c.id + '"' + (c.id === currentCat ? " selected" : "") + '>' + escapeHtml(c.label) + "</option>").join("") +
      "</select></td>";
    html += '<td><input type="number" class="period-max-input" data-original="' + escapeHtml(p) + '" value="' + periodMaxFor(p) + '" min="0.05" max="1" step="0.05" title="A full mark in this class is worth this many points toward the blended average"></td>';
    DAY_NAMES.forEach((d) => {
      const checked = (state.settings.schedule[p] || []).includes(d);
      html += '<td style="text-align:center;"><input type="checkbox" data-period="' + escapeHtml(p) + '" data-day="' + d + '" ' + (checked ? "checked" : "") + "></td>";
    });
    html += '<td><button class="btn btn-ghost btn-sm" data-remove-period="' + escapeHtml(p) + '" type="button">Remove</button></td></tr>';
  });
  html += "</tbody></table></div><button class=\"btn btn-primary btn-sm\" id=\"s-schedule-save\" style=\"margin-top:12px;\">Save schedule</button></div>";
  root.innerHTML = html;
  document.getElementById("s-schedule-save").addEventListener("click", async () => {
    // Read renames (keyed by each row's original name) and the day checkboxes (also keyed by
    // original name, since that's what the checkboxes' data-period still points at).
    const renameOf = {};
    let renameError = "";
    root.querySelectorAll(".period-name-input").forEach((inp) => {
      const original = inp.getAttribute("data-original");
      const next = inp.value.trim();
      if (!next) renameError = "A class name can’t be blank.";
      renameOf[original] = next;
    });
    const finalNames = state.settings.periods.map((p) => renameOf[p]);
    if (!renameError && new Set(finalNames).size !== finalNames.length) renameError = "Two classes can’t have the same name.";
    if (renameError) { toast(renameError, "warn"); return; }

    const schedByOriginal = {};
    state.settings.periods.forEach((p) => { schedByOriginal[p] = []; });
    root.querySelectorAll("input[data-period]").forEach((cb) => { if (cb.checked) schedByOriginal[cb.getAttribute("data-period")].push(cb.getAttribute("data-day")); });
    const categoryByOriginal = {};
    root.querySelectorAll(".period-category-input").forEach((sel) => { categoryByOriginal[sel.getAttribute("data-original")] = sel.value; });
    // Same clamp/fallback as periodMaxFor -- a blank, zero, negative, or >1 entry just falls
    // back to a normal full-weight 1 rather than blocking the whole save over one bad number.
    const maxByOriginal = {};
    root.querySelectorAll(".period-max-input").forEach((inp) => {
      const n = Number(inp.value);
      maxByOriginal[inp.getAttribute("data-original")] = (inp.value !== "" && !isNaN(n) && n > 0 && n <= 1) ? n : 1;
    });

    const newState = JSON.parse(JSON.stringify(state));
    newState.settings.periods = finalNames;
    const newSched = {};
    const newCategories = {};
    const newMax = {};
    state.settings.periods.forEach((p) => {
      newSched[renameOf[p]] = schedByOriginal[p];
      newCategories[renameOf[p]] = categoryByOriginal[p] || categoryFor(p);
      newMax[renameOf[p]] = maxByOriginal[p] || periodMaxFor(p);
    });
    newState.settings.schedule = newSched;
    newState.settings.periodCategories = newCategories;
    newState.settings.periodMax = newMax;
    // Carry past attendance over to the new name for anything actually renamed.
    state.settings.periods.forEach((p) => {
      const next = renameOf[p];
      if (next === p) return;
      newState.attendance.forEach((rec) => {
        if (rec.scores && Object.prototype.hasOwnProperty.call(rec.scores, p)) {
          rec.scores[next] = rec.scores[p];
          delete rec.scores[p];
        }
      });
    });
    const res = await saveState(newState);
    if (res.ok || res.local) { toast("Schedule saved.", "good"); renderAll(); }
  });
  document.getElementById("np-add").addEventListener("click", async () => {
    const nameInput = document.getElementById("np-name");
    const name = nameInput.value.trim();
    if (!name) { toast("Enter a class name.", "warn"); return; }
    if (state.settings.periods.includes(name)) { toast("There’s already a class called “" + name + "”.", "warn"); return; }
    const newState = JSON.parse(JSON.stringify(state));
    newState.settings.periods.push(name);
    newState.settings.schedule[name] = [];
    const res = await saveState(newState);
    if (res.ok || res.local) { toast("Added " + name + " — check off the days it runs below, then save the schedule.", "good"); renderAll(); }
  });
  root.querySelectorAll("[data-remove-period]").forEach((btn) => btn.addEventListener("click", async () => {
    const name = btn.getAttribute("data-remove-period");
    const newState = JSON.parse(JSON.stringify(state));
    newState.settings.periods = newState.settings.periods.filter((p) => p !== name);
    delete newState.settings.schedule[name];
    const res = await saveState(newState);
    if (res.ok || res.local) { toast("Removed " + name + " from the schedule.", "good"); renderAll(); }
  }));
  wireScheduleDrag(root);
}
/* Drag-to-reorder for the schedule table -- pointer events (not the HTML5 drag-and-drop API,
   which real touch devices don't support) so this works the same with a mouse or a thumb.
   Dragging the handle physically moves the <tr> live as you go, and the final DOM order is
   what gets saved on release -- any unsaved renames/checkboxes on OTHER rows are untouched
   since we never rebuild the table, only reorder the existing row elements. */
function wireScheduleDrag(root) {
  const tbody = root.querySelector("table tbody");
  if (!tbody) return;
  let draggingRow = null;
  const rowsInOrder = () => Array.from(tbody.querySelectorAll("tr[data-period-row]"));
  function onPointerMove(evt) {
    if (!draggingRow) return;
    evt.preventDefault();
    const y = (evt.touches && evt.touches[0]) ? evt.touches[0].clientY : evt.clientY;
    const others = rowsInOrder().filter((r) => r !== draggingRow);
    for (const r of others) {
      const rect = r.getBoundingClientRect();
      if (y < rect.top + rect.height / 2) {
        if (r.previousElementSibling !== draggingRow) tbody.insertBefore(draggingRow, r);
        return;
      }
    }
    tbody.appendChild(draggingRow);
  }
  async function onPointerUp() {
    if (!draggingRow) return;
    draggingRow.classList.remove("dragging-row");
    document.removeEventListener("pointermove", onPointerMove);
    document.removeEventListener("pointerup", onPointerUp);
    const newOrder = rowsInOrder().map((r) => r.getAttribute("data-period-row"));
    draggingRow = null;
    if (newOrder.length === state.settings.periods.length && newOrder.every((n, i) => n === state.settings.periods[i])) return;
    const newState = JSON.parse(JSON.stringify(state));
    newState.settings.periods = newOrder;
    const res = await saveState(newState);
    if (res.ok || res.local) renderAll();
  }
  root.querySelectorAll("[data-drag-handle]").forEach((handle) => {
    handle.addEventListener("pointerdown", (evt) => {
      const row = handle.closest("tr[data-period-row]");
      if (!row) return;
      evt.preventDefault();
      draggingRow = row;
      row.classList.add("dragging-row");
      document.addEventListener("pointermove", onPointerMove, { passive: false });
      document.addEventListener("pointerup", onPointerUp);
    });
  });
}

    let password = document.getElementById("st-password").value.trim();
    const role = document.getElementById("st-role").value;
    if (!name || !username) { toast("Enter a name and username.", "warn"); return; }
    const taken = new Set(state.staff.map((s) => s.username.toLowerCase()).concat(state.roster.map((s) => (s.username || "").toLowerCase())));
    if (taken.has(username.toLowerCase())) { toast("That username is already taken.", "warn"); return; }
    if (!password) password = randomPassword();
    const newState = JSON.parse(JSON.stringify(state));
    newState.staff.push({ id: uid("st"), name, username, password, role });
    const res = await saveState(newState);
    if (res.ok || res.local) { toast("Added " + name + " — password: " + password, "good"); renderAll(); }
  });
  root.querySelectorAll("[data-view-as-staff]").forEach((btn) => btn.addEventListener("click", () => {
    const id = btn.getAttribute("data-view-as-staff");
    const rec = staffById(id);
    viewAsSession = { type: "staff", id };
    goToRoute("today");
    if (rec) toast("Previewing as " + rec.name + ".", "good");
    renderAll();
  }));
  root.querySelectorAll("[data-reset-staff]").forEach((btn) => btn.addEventListener("click", async () => {
    const id = btn.getAttribute("data-reset-staff");
    const newState = JSON.parse(JSON.stringify(state));
    const rec = newState.staff.find((s) => s.id === id);
    const np = randomPassword();
    rec.password = np;
    const res = await saveState(newState);
    if (res.ok || res.local) { toast("New password for " + rec.name + ": " + np, "good"); renderAll(); }
  }));
  const bulkToggle = document.getElementById("st-bulk-toggle");
  if (bulkToggle) bulkToggle.addEventListener("click", () => { showBulkStaffForm = true; renderAdminStaff(root); });
  const bulkCancel = document.getElementById("st-bulk-cancel");
  if (bulkCancel) bulkCancel.addEventListener("click", () => { showBulkStaffForm = false; renderAdminStaff(root); });
  const bulkSubmit = document.getElementById("st-bulk-submit");
  if (bulkSubmit) bulkSubmit.addEventListener("click", async () => {
    const raw = document.getElementById("st-bulk-text").value;
    const lines = raw.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) { toast("Paste at least one staff member, one per line.", "warn"); return; }
    const taken = new Set(state.staff.map((s) => s.username.toLowerCase()).concat(state.roster.map((s) => (s.username || "").toLowerCase())));
    const added = [], skipped = [];
    const newState = JSON.parse(JSON.stringify(state));
    lines.forEach((line) => {
      const parsed = parseStaffLine(line);
      if (!parsed) { skipped.push(line); return; }
      const nameParts = parsed.name.trim().split(/\s+/);
      const last = nameParts.length > 1 ? nameParts[nameParts.length - 1] : "";
      const first = nameParts.length > 1 ? nameParts.slice(0, -1).join(" ") : parsed.name;
      const username = uniqueUsername(slugUsername(first, last || first), taken);
      taken.add(username);
      const password = randomPassword();
      newState.staff.push({ id: uid("st"), name: parsed.name, username, password, role: parsed.role });
      added.push({ name: parsed.name, username, password });
    });
    if (!added.length) { toast("Couldn't read any of those lines — one name per line, optionally \"Name, role\".", "warn"); return; }
    bulkStaffResult = { added, skipped };
    showBulkStaffForm = false;
    const res = await saveState(newState);
    if (res.ok || res.local) {
      toast("Added " + added.length + " staff account" + (added.length === 1 ? "" : "s") + (skipped.length ? " — " + skipped.length + " line(s) skipped" : ""), "good");
      renderAll();
    } else {
      bulkStaffResult = null;
    }
  });
  const bulkDismiss = document.getElementById("st-bulk-dismiss");
  if (bulkDismiss) bulkDismiss.addEventListener("click", () => { bulkStaffResult = null; renderAdminStaff(root); });
  root.querySelectorAll("[data-pw-toggle]").forEach((btn) => btn.addEventListener("click", () => {
    const key = btn.getAttribute("data-pw-toggle");
    if (revealedPasswords.has(key)) revealedPasswords.delete(key); else revealedPasswords.add(key);
    renderAdminStaff(root);
  }));
}

let bulkStudentResult = null;
let showBulkStudentForm = false;
let showArchivedStudents = false;
let confirmDeleteStudentId = null;
let editingStudentId = null;
// Which student's row-action menu is expanded (only one at a time) -- collapsing the five

let openStudentActionMenu = null;
function studentRow(s, archived) {

      added.push({ first: pair.first, last: pair.last, username, password });
    });
    if (!added.length) { toast("Couldn't read any of those lines — use \"Last, First\" or \"First Last\", one per line.", "warn"); return; }
    bulkStudentResult = { added, skipped };
    showBulkStudentForm = false;
    const res = await saveState(newState);
    if (res.ok || res.local) {
      toast("Added " + added.length + " student" + (added.length === 1 ? "" : "s") + (skipped.length ? " — " + skipped.length + " line(s) skipped" : ""), "good");
      renderAll();
    } else {
      bulkStudentResult = null;
    }
  });
  const bulkStudentDismiss = document.getElementById("r-bulk-dismiss");
  if (bulkStudentDismiss) bulkStudentDismiss.addEventListener("click", () => { bulkStudentResult = null; renderAdminStudents(root); });
}
