/* ================================================================
   VIEW: STUDENT DETAIL (staff/admin drill-down from any name)
   ================================================================ */
let viewingStudentId = null;
let sdScope = "all"; // "all" | "day" | "week" | "hmonth" | "custom"
let sdAnchor = todayISO();
let sdFrom = todayISO();
let sdTo = todayISO();
let sdClassFilter = null; // null = every class combined; otherwise one period name
let sdCalAnchor = todayISO(); // which Hebrew month the attendance calendar is showing
function wireStudentLinks(root) {
  root.querySelectorAll("[data-student-link]").forEach((el) => el.addEventListener("click", () => {
    viewingStudentId = el.getAttribute("data-student-link");
    sdScope = "all"; sdAnchor = todayISO(); sdFrom = todayISO(); sdTo = todayISO();
    sdClassFilter = null; sdCalAnchor = todayISO();
    renderAll();
  }));
}
/* Date window for the student-detail attendance/participation view — separate from the
   TAG Coin Balance hero, which always stays a true all-time running total. */
function sdRange() {
  if (sdScope === "day") return { from: sdAnchor, to: sdAnchor, title: fmtDateLong(sdAnchor), sub: "" };
  if (sdScope === "week") {
    const r = weekRangeFor(sdAnchor);
    const parsha = parshaFor(r.from);
    return { from: r.from, to: r.to, title: parsha || ("Week of " + fmtDateShort(r.from)), sub: fmtDateShort(r.from) + " – " + fmtDateShort(r.to) };
  }
  if (sdScope === "hmonth") {
    const r = hebrewMonthRangeFor(sdAnchor);
    if (!r) return { from: null, to: null, title: "This month", sub: "" };
    return { from: r.from, to: r.to, title: r.monthName + " " + r.year, sub: fmtDateShort(r.from) + " – " + fmtDateShort(r.to) };
  }
  if (sdScope === "custom") {
    const from = sdFrom <= sdTo ? sdFrom : sdTo;
    const to = sdFrom <= sdTo ? sdTo : sdFrom;
    return { from, to, title: "Custom range", sub: fmtDateShort(from) + " – " + fmtDateShort(to) };
  }
  return { from: null, to: null, title: "All time", sub: "Since the start of the year" };
}
/* ================================================================
   REPORT CARD — turns the free-text notes teachers leave on attendance
   entries into a short honest, positive-leaning written summary. Built
   entirely client-side: groups similar comments (exact match, or sharing
   most of their meaningful words), weighs them by how often they came up,
   and writes plain-language sentences from that — no AI involved.
   ================================================================ */
const REPORT_STOPWORDS = new Set(["the","a","an","was","were","is","are","he","she","they","him","her","his","hers",
  "today","in","class","very","so","really","and","with","to","had","has","have","being","it","this","that","of",
  "on","for","during","but","not","did","does","been","be","at","by","up","out","again","still","also","just","as"]);
const REPORT_POSITIVE_WORDS = new Set(["great","excellent","wonderful","amazing","fantastic","awesome","engaged",
  "engaging","focused","attentive","helpful","hardworking","hard-working","respectful","kind","energetic","energy",
  "energized","enthusiastic","enthusiasm","participating","participated","active","prepared","sharp","insightful",
  "motivated","positive","improved","improving","improvement","leader","leadership","cheerful","punctual","polite",
  "diligent","curious","thoughtful","strong","excellent","proud","confident","cooperative","friendly","eager"]);
const REPORT_NEGATIVE_WORDS = new Set(["sleeping","asleep","tired","sleepy","distracted","disruptive","talking",
  "late","unprepared","unfocused","disengaged","absent","disrespectful","rude","struggling","struggled","struggles",
  "difficult","inattentive","phone","texting","arguing","argued","complaining","complained","negative","withdrawn",
  "quiet","disruptive","missing","forgot","tardy","unmotivated","distracting","zoned","zoning"]);

function reportNormalize(s) { return String(s || "").toLowerCase().replace(/[.,!?;:'"()\-]/g, " ").replace(/\s+/g, " ").trim(); }
function reportSignificantWords(norm) {
  return new Set(norm.split(" ").filter((w) => w.length > 2 && !REPORT_STOPWORDS.has(w)));
}
function reportJaccard(a, b) {
  if (!a.size && !b.size) return 1;
  let inter = 0;
  a.forEach((w) => { if (b.has(w)) inter++; });
  const union = a.size + b.size - inter;
  return union === 0 ? 0 : inter / union;
}
/* Groups similar notes together (same normalized text, or >=50% overlap in
   their meaningful words) so "great energy" and "had great energy today"
   land in the same bucket instead of being counted as unrelated comments. */
function clusterNotes(notes) {
  const clusters = [];
  notes.forEach((n) => {
    const norm = reportNormalize(n.text);
    if (!norm) return;
    const words = reportSignificantWords(norm);
    let best = null, bestScore = 0;
    clusters.forEach((c) => {
      const score = reportJaccard(words, c.words);
      if (score > bestScore) { bestScore = score; best = c; }
    });
    if (best && bestScore >= 0.5) {
      best.items.push(n);
      words.forEach((w) => best.words.add(w));
      const counts = best.textCounts;
      counts[norm] = (counts[norm] || 0) + 1;
      if (counts[norm] > counts[best.repNorm]) { best.repNorm = norm; best.repText = n.text.trim(); }
    } else {
      clusters.push({ repNorm: norm, repText: n.text.trim(), words, items: [n], textCounts: { [norm]: 1 } });
    }
  });
  return clusters.sort((a, b) => b.items.length - a.items.length);
}
function clusterSentiment(cluster) {
  let pos = 0, neg = 0;
  cluster.words.forEach((w) => { if (REPORT_POSITIVE_WORDS.has(w)) pos++; if (REPORT_NEGATIVE_WORDS.has(w)) neg++; });
  if (pos > neg) return "positive";
  if (neg > pos) return "negative";
  return "neutral";
}
function reportPronouns(gender) {
  // No gender field on students, so this stays neutral ("they") — accurate for every student without guessing.
  return { subj: "they", obj: "them", poss: "their" };
}
/* Builds the written paragraph. Always honest about the dominant pattern in
   the actual comments (never hides a mostly-negative trend), but leads with
   constructive framing and closes on a forward-looking, positive note. */
function generateReportNarrative(firstName, clusters, stats, totalDays) {
  const totalNotes = clusters.reduce((s, c) => s + c.items.length, 0);
  const pn = reportPronouns();
  const hasStats = stats.attPct !== null || stats.partPct !== null;
  const statsLine = hasStats
    ? "Over this period, " + firstName + "'s attendance was " + pct(stats.attPct) +
      " and participation was " + pct(stats.partPct) +
      (totalDays ? " across " + totalDays + " " + (totalDays === 1 ? "class" : "classes") + "." : ".")
    : "";

  if (totalNotes === 0) {
    if (!hasStats) return "There’s no attendance, participation, or comment data recorded for " + pn.obj + " in this period yet.";
    return statsLine + " No specific comments were logged for " + pn.obj + " this period, so this summary is based on the numbers alone.";
  }

  const positive = clusters.filter((c) => clusterSentiment(c) === "positive").sort((a, b) => b.items.length - a.items.length);
  const negative = clusters.filter((c) => clusterSentiment(c) === "negative").sort((a, b) => b.items.length - a.items.length);
  const topPos = positive[0], topNeg = negative[0];
  // Nothing repeated more than once on either side — every comment was phrased
  // a little differently, so "most often" would overstate a pattern that isn't
  // really there. Speak to what was said rather than how often.
  const noRealRepeat = (!topPos || topPos.items.length <= 1) && (!topNeg || topNeg.items.length <= 1);
  const sentences = [];

  if (topNeg && topPos && topNeg.items.length > topPos.items.length) {
    // Dominant negative theme, with a real positive counter-example — the exact "mostly sleeping,
    // but great energy when awake" pattern this feature was built around.
    sentences.push("Most days this period, comments described " + firstName + " as “" + topNeg.repText.toLowerCase() +
      "” (" + topNeg.items.length + " of " + totalNotes + " comments).");
    sentences.push("On the days that wasn’t the case, though, " + pn.subj + " showed real promise — comments noted " +
      pn.obj + " as “" + topPos.repText.toLowerCase() + "” (" + topPos.items.length + " " + (topPos.items.length === 1 ? "time" : "times") + ").");
    sentences.push("That contrast is worth paying attention to: whatever’s different on the good days seems to work well — more of that would likely help across the board.");
  } else if (topPos && (!topNeg || topPos.items.length >= topNeg.items.length)) {
    // Positive is the dominant or tied pattern.
    if (noRealRepeat) {
      sentences.push("Comments this period were consistently positive for " + firstName + ", including being described as “" + topPos.repText.toLowerCase() + "”.");
    } else {
      sentences.push("Comments this period were mostly positive — " + firstName + " was most often described as “" +
        topPos.repText.toLowerCase() + "” (" + topPos.items.length + " of " + totalNotes + " comments).");
    }
    if (topNeg) {
      sentences.push("A smaller number of comments (" + topNeg.items.length + ") also mentioned “" + topNeg.repText.toLowerCase() +
        "” — worth keeping an eye on, though it wasn’t the dominant pattern.");
    } else {
      sentences.push("Keep it up — that’s a strong, consistent pattern to build on.");
    }
  } else if (topNeg && !topPos) {
    // Only negative comments logged, no positive counter-example this period.
    sentences.push("Most comments this period noted " + firstName + " as “" + topNeg.repText.toLowerCase() +
      "” (" + topNeg.items.length + " of " + totalNotes + " comments) — worth a direct, supportive conversation about what’s getting in the way.");
    sentences.push("The good news: patterns like this are usually fixable once the underlying cause (tiredness, something going on at home, etc.) is understood — it doesn’t reflect a lack of ability.");
  } else {
    // Neutral / no clear sentiment either way — just report the most common theme factually.
    const top = clusters[0];
    sentences.push("The most common note this period was “" + top.repText.toLowerCase() + "” (" + top.items.length +
      " of " + totalNotes + " comments) — " + statsLine.charAt(0).toLowerCase() + statsLine.slice(1));
    return sentences.join(" ");
  }
  if (statsLine) sentences.push(statsLine);
  return sentences.join(" ");
}

function notesForStudent(studentId, from, to) {
  const notes = [];
  state.attendance.forEach((rec) => {
    if (rec.studentId !== studentId) return;
    if (from && rec.date < from) return;
    if (to && rec.date > to) return;
    if (!rec.scores) return;
    Object.keys(rec.scores).forEach((p) => {
      const pair = rec.scores[p];
      const note = pair && pair[2];
      if (note && String(note).trim()) notes.push({ date: rec.date, period: p, text: String(note).trim() });
    });
  });
  return notes;
}

/* Attendance calendar (student detail page) — one Hebrew month at a time, every day colored
   by that day's blended attendance+participation average (across every class held that day,
   or just one class when sdClassFilter is set). Clicking a day drills the whole page's
   time-range picker into that single day; the class dropdown here and the "By class" table's
   clickable rows both write the same sdClassFilter, so either one narrows both the calendar

function renderStudentCalendarHtml(student) {
  const monthRange = hebrewMonthRangeFor(sdCalAnchor);

  if (!monthRange || !hdayOptions.length) return ""; // Hebrew calendar library unavailable

  const todayGregISO = todayISO();
  const periods = state.settings.periods;

  let html = '<div style="display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px;">' +
    '<div class="field" style="min-width:180px;margin-bottom:0;"><label for="sd-cal-class">Class</label><select id="sd-cal-class">' +
    '<option value=""' + (!sdClassFilter ? " selected" : "") + '>All classes</option>' +
    periods.map((p) => '<option value="' + escapeHtml(p) + '"' + (sdClassFilter === p ? " selected" : "") + '>' + escapeHtml(p) + "</option>").join("") +
    "</select></div></div>";

  html += '<div class="sd-cal-nav">' +
    '<button class="btn btn-ghost btn-sm" id="sd-cal-prev" type="button" title="Previous Hebrew month">&larr;</button>' +
    '<span class="sd-cal-title">' + escapeHtml(monthRange.monthName + " " + monthRange.year) + "</span>" +
    '<button class="btn btn-ghost btn-sm" id="sd-cal-next" type="button" title="Next Hebrew month">&rarr;</button>' +
    '<button class="btn btn-ghost btn-sm" id="sd-cal-today" type="button">This month</button>' +
    "</div>";

  html += '<div class="sd-cal-grid">' +
    DAY_NAMES.map((n) => '<div class="sd-cal-dow">' + escapeHtml(n.slice(0, 2)) + "</div>").join("") +
    Array(firstDow).fill('<div class="sd-cal-cell sd-cal-blank"></div>').join("") +
    hdayOptions.map((o) => {
      const st = computeStats(student.id, sdClassFilter ? { from: o.date, to: o.date, period: sdClassFilter } : { from: o.date, to: o.date });
      const hasData = st.blendedPct !== null && st.blendedPct !== undefined;
      const tone = hasData ? pctTone(st.blendedPct) : "";
      const isToday = o.date === todayGregISO;
      const isSel = sdScope === "day" && o.date === sdAnchor;
      const gregDay = jsDateFor(o.date).getDate();
      const hebNum = hebrewDayNumeral(o.date) || "";
      const titleText = fmtDateLong(o.date) + (hasData ? " — " + pct(st.blendedPct) : sdClassFilter ? " — not held / not marked" : " — nothing entered");
      return '<button type="button" class="sd-cal-cell sd-cal-day' + (tone ? " tone-" + tone : " sd-cal-empty") +
        (isToday ? " sd-cal-today" : "") + (isSel ? " sd-cal-sel" : "") + '" data-sd-cal-date="' + o.date + '" title="' + escapeHtml(titleText) + '">' +
        '<span class="sd-cal-day-top"><span class="sd-cal-greg">' + gregDay + '</span><span class="sd-cal-heb">' + escapeHtml(hebNum) + "</span></span>" +
        (hasData ? '<span class="sd-cal-val">' + Math.round(st.blendedPct * 100) + "%</span>" : "") +
        "</button>";
    }).join("") +
    "</div>";

  html += '<p class="help-text" style="margin-top:10px;">Each day blends attendance and participation across ' +
    (sdClassFilter ? escapeHtml(sdClassFilter) : "every class held that day") + '. Click a day to see just that day above.</p>';
  return html;
}

/* The student's own "full week" attendance sheet -- every class held at least once this week
   down the side, the 7 days of that week (Sun-Sat) across the top, so a student (or staff
   looking at one student) can see at a glance which classes were marked, missed, or not
   scheduled that day -- the same read a printed weekly attendance sheet gives. Only shown
   while sdScope is "week" (see renderStudentDetail), since it needs one specific week to lay
   out as columns; reuses the same weeklySheetCellHtml/att-grid machinery as the teacher-facing
   roster-wide version of this in Reports (renderRosterWeekGridHtml). */
function renderStudentWeekGridHtml(student, weekFrom) {
  const days = Array.from({ length: 7 }, (_, i) => shiftDate(weekFrom, i));
  const todayGregISO = todayISO();
  const weekPeriods = state.settings.periods.filter((p) => days.some((d) => periodsForDate(d).includes(p)));
  let html = '<div class="section-title"><span>Week at a glance</span></div>' +
    '<p style="margin:2px 0 12px;font-size:0.82rem;color:var(--muted);">Every class this week, day by day — a hatched cell means that class wasn’t scheduled that day.</p>';
  if (!weekPeriods.length) {
    html += '<p class="help-text">No classes are scheduled this week.</p>';
    return html;
  }
  html += '<div class="att-grid-scroll"><table class="att-grid"><thead><tr><th style="position:sticky;left:0;background:var(--surface-2);z-index:2;">Class</th>';
  days.forEach((d, i) => {
    html += '<th class="' + (d === todayGregISO ? "col-active" : "") + '"><span class="period-name">' + escapeHtml(DAY_NAMES[i].slice(0, 3)) +
      '</span><br><span class="sub">' + escapeHtml(fmtDateShort(d)) + "</span></th>";
  });
  html += "</tr></thead><tbody>";
  weekPeriods.forEach((p) => {
    html += '<tr><td class="student-cell">' + escapeHtml(p) + "</td>";
    days.forEach((d) => { html += weeklySheetCellHtml(d, p, student.id, d === todayGregISO ? "col-active" : ""); });
    html += "</tr>";
  });
  html += "</tbody></table></div>";
  return html;
}

    ) + "</p></div></div>";

  html += '<div class="card card-pad coin-hero" style="margin-bottom:16px;">' + coinBadge("lg") +

  html += '<div class="card card-pad" style="margin-bottom:16px;"><div class="field-row">' +
    '<div class="field" style="min-width:190px;"><label for="sd-scope">Attendance &amp; participation for</label><select id="sd-scope">' +
    '<option value="all"' + (sdScope === "all" ? " selected" : "") + '>All time</option>' +
    '<option value="day"' + (sdScope === "day" ? " selected" : "") + '>A specific day</option>' +
    '<option value="week"' + (sdScope === "week" ? " selected" : "") + '>A specific week</option>' +
    '<option value="hmonth"' + (sdScope === "hmonth" ? " selected" : "") + '>A specific Hebrew month</option>' +
    '<option value="custom"' + (sdScope === "custom" ? " selected" : "") + '>Custom range</option>' +
    "</select></div>" +
    (sdScope === "day" ? '<div class="field" style="min-width:150px;"><label for="sd-day">Day</label><input type="date" id="sd-day" value="' + escapeHtml(sdAnchor) + '"></div>' : "") +
    (sdScope === "day" || sdScope === "week" || sdScope === "hmonth" ? '<div class="field" style="flex-shrink:0;min-width:auto;"><label>&nbsp;</label><div style="display:flex;gap:6px;flex-wrap:wrap;">' +
      '<button class="btn btn-ghost btn-sm" id="sd-prev" type="button">&larr;</button>' +
      '<button class="btn btn-ghost btn-sm" id="sd-today" type="button">Today</button>' +
      '<button class="btn btn-ghost btn-sm" id="sd-next" type="button">&rarr;</button></div></div>' : "") +
    (sdScope === "custom" ? '<div class="field" style="min-width:150px;"><label for="sd-from">From</label><input type="date" id="sd-from" value="' + escapeHtml(sdFrom) + '"></div>' +
      '<div class="field" style="min-width:150px;"><label for="sd-to">To</label><input type="date" id="sd-to" value="' + escapeHtml(sdTo) + '"></div>' : "") +
    "</div>" +
    (sdScope === "day" || sdScope === "week" || sdScope === "hmonth" ? '<div style="margin-top:2px;font-family:var(--font-display);font-weight:800;font-size:1.05rem;">' + escapeHtml(range.title) + "</div>" +

  const scopeSuffix = sdScope === "all" ? " (all time)" : "";
  const classSuffix = sdClassFilter ? " — " + sdClassFilter : "";
  html += '<div class="grid-stats">' +

    trail.forEach((tx) => {

      coinActivityBody += "<tr><td>" + fmtDateShort(tx.date) + "</td><td>" + txPill(tx.type) + '</td><td class="num" style="font-weight:700;color:' + (out ? "var(--warn)" : "var(--gold)") + ';">' + (out ? "−" : "+") + num2(tx.amount) + '</td><td class="num">' + num2(tx.balanceAfter) + "</td><td>" + escapeHtml(tx.note || "") + "</td></tr>";
    });
    coinActivityBody += "</tbody></table></div>";
  }
  html += collapsibleSectionHtml("sdCoinActivity", "Recent coin activity", null, coinActivityBody);

  const logRows = [];
  state.attendance.forEach((rec) => {
    if (rec.studentId !== student.id || !rec.scores) return;
    if (range.from && rec.date < range.from) return;
    if (range.to && rec.date > range.to) return;
    Object.keys(rec.scores).forEach((p) => {
      if (sdClassFilter && p !== sdClassFilter) return;
      const pair = rec.scores[p];
      if (!pair) return;
      const excused = !!pair[4];
      // Excused entries have no att/part score by design (that's what keeps them out of the
      // percentages) -- don't let the "no score" skip below also hide them from this log.
      if (!excused && (pair[0] === null || pair[0] === undefined)) return;
      logRows.push({ date: rec.date, period: p, att: pair[0], part: pair[1], note: pair[2] || "", by: pair[3] || "", excused, bonus: isBonusPeriod(rec.date, p) });
    });
  });
  logRows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.period.localeCompare(b.period)));
  let logBody;
  if (logRows.length === 0) {
    logBody = '<p class="help-text">' + (sdScope === "all" ? "Nothing entered for this student yet." : "Nothing entered for this student in this range.") + '</p>';
  } else {
    logBody = '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Class</th><th class="num">Attendance</th><th class="num">Participation</th><th>Note</th><th>By</th></tr></thead><tbody>';
    logRows.slice(0, 150).forEach((r) => {
      const attPartHtml = r.excused
        ? '<td class="num" colspan="2" style="color:var(--gold);font-weight:600;">Excused</td>'
        : '<td class="num">' + num2(r.att) + '</td><td class="num">' + (r.part === null || r.part === undefined ? "—" : num2(r.part)) + "</td>";
      logBody += "<tr><td>" + fmtDateShort(r.date) + "</td><td>" + escapeHtml(r.period) + (r.bonus ? ' <span class="pill pill-gold" title="Bonus that day — only helped, never hurt">★</span>' : "") + "</td>" + attPartHtml + "<td>" + escapeHtml(r.note) +
        '</td><td>' + (r.by ? '<span class="marked-by marked-by-sm" title="' + escapeHtml(r.by) + '">' + escapeHtml(initialsFor(r.by)) + "</span>" : "") + "</td></tr>";
    });
    logBody += "</tbody></table></div>";
    if (logRows.length > 150) logBody += '<p class="help-text" style="margin-top:8px;">Showing the most recent 150 of ' + logRows.length + ' entries.</p>';
  }
  html += collapsibleSectionHtml("sdLog", "Attendance & participation log" + (sdClassFilter ? " — " + sdClassFilter : ""), null, logBody);

  root.innerHTML = html;
  wireGlanceCircles(root); // lets a tap on the weekly sheet reveal the exact number
  const backBtn = document.getElementById("sd-back");
  if (backBtn) backBtn.addEventListener("click", () => { viewingStudentId = null; renderAll(); });

  const sdScopeSel = document.getElementById("sd-scope");
  if (sdScopeSel) sdScopeSel.addEventListener("change", () => { sdScope = sdScopeSel.value; renderAll(); });
  const sdDayInput = document.getElementById("sd-day");
  if (sdDayInput) sdDayInput.addEventListener("change", () => { sdAnchor = sdDayInput.value || sdAnchor; renderAll(); });
  const sdPrev = document.getElementById("sd-prev");
  if (sdPrev) sdPrev.addEventListener("click", () => {
    sdAnchor = sdScope === "day" ? shiftDate(sdAnchor, -1) : sdScope === "week" ? shiftDate(sdAnchor, -7) : shiftHebrewMonth(sdAnchor, -1);
    renderAll();
  });
  const sdNext = document.getElementById("sd-next");
  if (sdNext) sdNext.addEventListener("click", () => {
    sdAnchor = sdScope === "day" ? shiftDate(sdAnchor, 1) : sdScope === "week" ? shiftDate(sdAnchor, 7) : shiftHebrewMonth(sdAnchor, 1);
    renderAll();
  });
  const sdTodayBtn = document.getElementById("sd-today");
  if (sdTodayBtn) sdTodayBtn.addEventListener("click", () => { sdAnchor = todayISO(); renderAll(); });
  const sdFromInput = document.getElementById("sd-from");
  if (sdFromInput) sdFromInput.addEventListener("change", () => { sdFrom = sdFromInput.value || sdFrom; renderAll(); });
  const sdToInput = document.getElementById("sd-to");
  if (sdToInput) sdToInput.addEventListener("change", () => { sdTo = sdToInput.value || sdTo; renderAll(); });
  const printBtn = document.getElementById("sd-print");
  if (printBtn) printBtn.addEventListener("click", () => window.print());

  const clearClassBtn = document.getElementById("sd-class-clear");
  if (clearClassBtn) clearClassBtn.addEventListener("click", () => { sdClassFilter = null; renderAll(); });
  root.querySelectorAll("[data-sd-class-row]").forEach((row) => row.addEventListener("click", () => {
    const p = row.getAttribute("data-sd-class-row");
    sdClassFilter = sdClassFilter === p ? null : p; // clicking the already-selected class clears it
    renderAll();
  }));

  const calClassSel = document.getElementById("sd-cal-class");
  if (calClassSel) calClassSel.addEventListener("change", () => { sdClassFilter = calClassSel.value || null; renderAll(); });
  const calPrev = document.getElementById("sd-cal-prev");
  if (calPrev) calPrev.addEventListener("click", () => { sdCalAnchor = shiftHebrewMonth(sdCalAnchor, -1); renderAll(); });
  const calNext = document.getElementById("sd-cal-next");
  if (calNext) calNext.addEventListener("click", () => { sdCalAnchor = shiftHebrewMonth(sdCalAnchor, 1); renderAll(); });
  const calTodayBtn = document.getElementById("sd-cal-today");
  if (calTodayBtn) calTodayBtn.addEventListener("click", () => { sdCalAnchor = todayISO(); renderAll(); });
  root.querySelectorAll(".sd-cal-day").forEach((btn) => btn.addEventListener("click", () => {
    // Clicking a day drills the whole page's time-range picker into just that day, so the
    // stat tiles, report card, and log above all reflect it too -- not just the calendar.
    sdScope = "day";
    sdAnchor = btn.getAttribute("data-sd-cal-date");
    renderAll();
  }));
}

/* ================================================================
   RENDER DISPATCH
   ================================================================ */
function renderAll() {
  const shellEl = document.getElementById("shell");
  const loginEl = document.getElementById("login-root");
  if (!state) {
    if (shellEl) shellEl.style.display = "none";
    if (loginEl) { loginEl.style.display = ""; loginEl.innerHTML = '<div class="login-wrap"><p class="sub" style="text-align:center;">Loading TAG Academy…</p></div>'; }
    return;
  }
  const realSession = currentSession();
  if (!realSession) {
    if (shellEl) shellEl.style.display = "none";
    if (loginEl) { loginEl.style.display = ""; renderLogin(loginEl); }
    return;
  }
  // Swap in the previewed person's session for everything rendering-related (nav, routes,
  // page content) while keeping realSession around for the exit-preview banner. Only an
  // actual admin can be mid-preview; if the previewed record got deleted mid-preview, fall
  // back to the real session instead of rendering a page for someone who no longer exists.
  let session = realSession;
  let previewing = false;
  if (viewAsSession && isAdmin(realSession)) {
    const rec = viewAsSession.type === "staff" ? staffById(viewAsSession.id) : studentById(viewAsSession.id);
    if (rec) { session = { type: viewAsSession.type, record: rec }; previewing = true; }
    else { viewAsSession = null; }
  }
  if (shellEl) shellEl.style.display = "";
  if (loginEl) loginEl.style.display = "none";
  renderShell(session, previewing);
  const root = document.getElementById("view-root");
  if (!root) return;
  const role = roleOf(session);
  if (viewingStudentId && (role === "admin" || role === "teacher")) {
    const student = studentById(viewingStudentId);
    if (student) { renderStudentDetail(root, student); wireStudentLinks(root); wireCollapsibleSections(root); return; }
    viewingStudentId = null;
  }
  const route = currentRoute(session);
  // View-as is a preview, not a way to act as someone else -- force every write path off for
  // the duration of this one render (every renderer reads canWrite synchronously while
  // building its HTML/wiring, so restoring it right after is safe).
  const savedCanWrite = canWrite;
  if (previewing) canWrite = false;
  ({ today: renderToday, ledger: renderLedger, overview: renderOverview, leaderboard: renderLeaderboard, admin: renderAdmin, balance: renderMyBalance })[route](root, session);
  canWrite = savedCanWrite;
  wireStudentLinks(root);
  wireCollapsibleSections(root);
}

/* ================================================================
   INIT
   ================================================================ */
async function init() {
  renderAll(); // shows the "Loading..." screen (state is still null at this point)
  try {
    await loadState();
  } catch (e) {
    console.error("Could not connect to Firebase:", e);
    canWrite = false;
    state = seedState(); // so the page can still render something rather than staying blank
    const loginEl = document.getElementById("login-root");
    if (loginEl) loginEl.innerHTML = '<div class="login-wrap"><div class="login-card"><p class="sub" style="text-align:center;color:var(--warn);">Couldn’t connect — check your internet connection and reload the page.</p></div></div>';
    return;
  }
  renderAll();
  listenForLiveUpdates();
}
// With several people marking attendance at once, everyone's copy of `state` needs to stay
// current on its own -- not just right after this device's own saves -- or two people looking
// at the same class can each be working from data that's gone stale the moment the other one
// saves. This keeps every open tab/device subscribed to the one shared document and pulls in
// whatever anyone (including a different tab of the same person) just saved, in real time.
function applyIncomingState(incoming) {
  if (!incoming) return;
  // saveState() already sets `state` to exactly this same object right after a successful
  // write of its own, and Firestore's SDK fires the listener for that local write too (an
  // immediate local echo, then again once the server confirms it) -- comparing `_rev` skips
  // acting on our own save a second time, so it doesn't trigger a redundant re-render or
  // stomp on whatever the person has started doing since that save went through.
  if (state && incoming._rev === state._rev) return;
  state = incoming;
  refreshViewOrDefer();
}
function listenForLiveUpdates() {
  // A phone's screen turning off, a laptop going to sleep, or a wifi network dropping for a
  // moment can all leave Firestore's realtime "watch" channel silently stalled -- no error,
  // no more updates, just quietly stuck -- which is exactly what makes it look like the app
  // "needs a refresh." Resubscribing (with a short, backing-off delay so a real outage
  // doesn't spam retries) heals a channel that errored out on its own; the visibility/online
  // listeners and the periodic catch-up poll below heal the far more common case where it
  // stalls silently and never calls the error handler at all.
  let retryDelay = 2000;
  function subscribe() {
    return STATE_DOC.onSnapshot((snap) => {
      retryDelay = 2000;
      if (!snap.exists) return;
      applyIncomingState(snap.data());
    }, (err) => {
      console.error("Live sync error:", err);
      setTimeout(subscribe, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
    });
  }
  subscribe();

  // Belt-and-suspenders beyond the push-based listener above: catch up with one plain fetch
  // the moment a backgrounded tab is looked at again or the network comes back, instead of
  // waiting on the realtime channel to notice by itself.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") syncNow();
  });
  window.addEventListener("online", syncNow);
  // And a final safety net that needs no trigger at all: every 20 seconds, just check --
  // so even a stall none of the above catches can never leave a screen more than about 20
  // seconds out of date.
  setInterval(syncNow, 20000);
}
function syncNow() {
  STATE_DOC.get().then((snap) => {
    if (snap.exists) applyIncomingState(snap.data());
  }).catch((err) => console.error("Live sync catch-up failed:", err));
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
